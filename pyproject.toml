[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vm4ai-air"
dynamic = ["version"]
description = "AIR local runtime, installed canonical resources, and project workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "VM4AI" }
]
keywords = ["ai", "runtime", "prompt", "cli", "project-workspace"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://vm4ai.com"
Repository = "https://github.com/eddlev/vm4ai-air-kit"
Issues = "https://github.com/eddlev/vm4ai-air-kit/issues"

[project.scripts]
air = "vm4ai_air.cli:main"

[tool.hatch.version]
path = "src/vm4ai_air/version.py"

[tool.hatch.build]
exclude = [
  "/.air-build",
  "/.git",
  "/.pytest_cache",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vm4ai_air"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/prompts",
  "/profiles",
  "/runtime",
  "/docs",
  "/examples",
  "/release",
  "/.github/workflows",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
  "/hatch_build.py",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "package: requires a built distribution and isolated installation",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
