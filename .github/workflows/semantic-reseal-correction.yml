name: AIR semantic reseal correction

on:
  push:
    branches:
      - repair/v0.7.1-set005-hardening
    paths:
      - .github/workflows/semantic-reseal-correction.yml

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded correction
        run: python3 tools/semantic_reseal_correction.py

      - name: Run deterministic validator
        run: |
          python3 tools/validate_air_release.py | tee /tmp/validator-output.txt
          git diff --check

      - name: Remove temporary correction script
        run: rm tools/semantic_reseal_correction.py

      - name: Commit bounded correction
        run: |
          git config user.name "EddLev | VM4AI"
          git config user.email "contact@vm4ai.com"
          git add profiles catalog/AIR_SPECIALIST_PACKAGE_INDEX.json tools/validate_air_release.py tests/air_contract_fixtures.json
          git add -A tools/semantic_reseal_correction.py
          git diff --cached --quiet && { echo "No correction changes produced"; exit 1; }
          git commit -m "fix(set005): close semantic reseal-state gaps and validator coverage"
          git push origin HEAD:repair/v0.7.1-set005-hardening

      - name: Upload correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-reseal-correction-evidence
          path: |
            /tmp/semantic-reseal-report.json
            /tmp/validator-output.txt
          if-no-files-found: warn
