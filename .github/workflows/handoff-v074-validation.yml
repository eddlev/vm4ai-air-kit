name: AIR Handoff v0.7.4 full-tree validation
on:
  push:
    branches: [air/handoff-v074-validation-20260917]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ contains(github.event.head_commit.message, '[air-handoff-v074-validate]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify exact base
        run: test "$(git rev-parse HEAD^)" = f456fc579bed739aebcfaa55c175c2c14617d58d
      - name: Reconstruct approved runner-only payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .air-validation
          cat >/tmp/payload.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/payload.b64 | xz -d | tar -xf - -C .air-validation
          rm /tmp/payload.b64
      - name: Apply patch and coordinated reseal
        run: python3 .air-validation/helpers/apply_air_v074_handoff_release_candidate.py . .air-validation .air-validation/helpers/apply_handoff_runtime_patch.py
      - name: Remove temporary harness
        run: rm -rf .air-validation .github/workflows/handoff-v074-validation.yml
      - name: Enforce confirmed final inventory
        shell: bash
        run: |
          python3 - <<'PY2'
          import subprocess
          allowed=set(['catalog/AIR_RUNTIME_ROUTE_MAP.json', 'catalog/AIR_SPECIALIST_PACKAGE_INDEX.json', 'profiles/capability ecology architect/AIR_CAPABILITY_ECOLOGY_ARCHITECT.json', 'profiles/capability ecology architect/AIR_CAPABILITY_ECOLOGY_ARCHITECT_PACKAGE_MANIFEST.json', 'profiles/capability ecology architect/AIR_CAPABILITY_ECOLOGY_METHOD_PACK.json', 'profiles/capability ecology architect/AIR_DOMAIN_CAPABILITY_REGISTRY.json', 'profiles/capability ecology architect/AIR_HUMAN_TO_MACHINE_CAPABILITY_TRANSLATOR.json', 'profiles/governance specialist/AIR_AI_GOVERNANCE_AGENTIC_OVERLAY.json', 'profiles/governance specialist/AIR_AI_GOVERNANCE_DOMAIN_PACKAGE.json', 'profiles/governance specialist/AIR_AI_GOVERNANCE_EXECUTOR.json', 'profiles/governance specialist/AIR_AI_GOVERNANCE_METHOD_PACK.json', 'profiles/governance specialist/AIR_AI_GOVERNANCE_SPECIALIST.json', 'profiles/governance specialist/AIR_AI_GOVERNANCE_SPECIALIST_PACKAGE_MANIFEST.json', 'profiles/grounding specialist/AIR_GROUNDING_DOMAIN_PACKAGE.json', 'profiles/grounding specialist/AIR_GROUNDING_EXECUTOR.json', 'profiles/grounding specialist/AIR_GROUNDING_METHOD_PACK.json', 'profiles/grounding specialist/AIR_GROUNDING_SPECIALIST.json', 'profiles/grounding specialist/AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json', 'profiles/public surface copywriting specialist/AIR_PUBLIC_SURFACE_COPYWRITING_METHOD_PACK.json', 'profiles/public surface copywriting specialist/AIR_PUBLIC_SURFACE_COPYWRITING_SPECIALIST.json', 'profiles/public surface copywriting specialist/AIR_PUBLIC_SURFACE_COPYWRITING_SPECIALIST_PACKAGE_MANIFEST.json', 'profiles/specification first verification specialist/AIR_SPECIFICATION_FIRST_VERIFICATION_DOMAIN_PACKAGE.json', 'profiles/specification first verification specialist/AIR_SPECIFICATION_FIRST_VERIFICATION_EXECUTOR.json', 'profiles/specification first verification specialist/AIR_SPECIFICATION_FIRST_VERIFICATION_METHOD_PACK.json', 'profiles/specification first verification specialist/AIR_SPECIFICATION_FIRST_VERIFICATION_SPECIALIST.json', 'profiles/specification first verification specialist/AIR_SPECIFICATION_FIRST_VERIFICATION_SPECIALIST_PACKAGE_MANIFEST.json', 'prompts/AIR_CONTROL_SURFACE.md', 'prompts/AIR_CORE_RUNTIME.md', 'prompts/AIR_DEFAULT_STARTER_PROFILE.json', 'prompts/AIR_HANDOFF_CARD_TEMPLATE.json', 'tests/AIR_AI_GOVERNANCE_SET008_BEHAVIORAL_EVIDENCE_V2.json', 'tests/AIR_CAPABILITY_ECOLOGY_ARCHITECT_SET008_BEHAVIORAL_EVIDENCE_V2.json', 'tests/AIR_GROUNDING_SET008_BEHAVIORAL_EVIDENCE_V2.json', 'tests/AIR_HANDOFF_V074_RUNTIME_BEHAVIORAL_EVIDENCE_V1.json', 'tests/AIR_PUBLIC_SURFACE_COPYWRITING_SET008_BEHAVIORAL_EVIDENCE_V2.json', 'tests/AIR_SPECIFICATION_FIRST_VERIFICATION_SET008_BEHAVIORAL_EVIDENCE_V2.json', 'tests/air_contract_fixtures.json', 'tests/deterministic_contract_inventory.json', 'tools/test_air_behavioral_contract_mutations.py', 'tools/test_air_control_plane_mutations.py', 'tools/test_air_handoff_runtime_contract_mutations.py', 'tools/test_air_r3_mutations.py', 'tools/test_air_r7_mutations.py', 'tools/test_air_v074_release_seal_mutations.py', 'tools/validate_air_behavioral_contracts.py', 'tools/validate_air_boot.py', 'tools/validate_air_control_plane.py', 'tools/validate_air_handoff_runtime_contract.py', 'tools/validate_air_r1_remediation.py', 'tools/validate_air_r3_remediation.py', 'tools/validate_air_r7_remediation.py', 'tools/validate_air_suite.py', 'tools/validate_air_v074_release_seal.py'])
          base='f456fc579bed739aebcfaa55c175c2c14617d58d'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'--'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          extra=sorted(changed-allowed)
          if extra: raise SystemExit('out-of-scope delta '+repr(extra))
          if '.github/workflows/handoff-v074-validation.yml' in changed or any(x.startswith('.air-validation/') for x in changed): raise SystemExit('temporary scaffolding leaked')
          print('confirmed patch inventory PASS',len(changed))
          PY2
      - name: Candidate suite
        run: python3 tools/validate_air_suite.py --candidate
      - name: Exact-release suite
        run: python3 tools/validate_air_suite.py
      - name: Reseal fixed point
        run: python3 tools/reseal_air_candidate.py --check
      - name: Commit validated canonical patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate AIR v0.7.4 Handoff runtime patch [air-handoff-v074-validated]'
          test -z "$(git diff --name-only f456fc579bed739aebcfaa55c175c2c14617d58d..HEAD | grep -E '^(\.air-validation/|\.github/workflows/handoff-v074-validation.yml$)' || true)"
          git push origin HEAD:air/handoff-v074-validation-20260917
