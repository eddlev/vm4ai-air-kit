name: Apply R1 audit remediation

on:
  push:
    branches: [audit-remediation-r1-939801a9]

permissions:
  contents: write

jobs:
  apply-r1:
    if: ${{ !contains(github.event.head_commit.message, '[r1-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply R1 source repair
        run: python3 tools/apply_r1_remediation.py .

      - name: Validate repaired R1 contract
        run: |
          python3 tools/validate_air_contract_registry.py
          python3 tools/validate_air_r1_remediation.py
          python3 tools/test_air_contract_registry_mutations.py
          python3 tools/test_air_r1_mutations.py

      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo "No R1 source changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompts/AIR_CORE_RUNTIME.md \
                  prompts/AIR_DEFAULT_STARTER_PROFILE.json \
                  prompts/AIR_CONTROL_SURFACE.md \
                  catalog/AIR_RUNTIME_ROUTE_MAP.json
          git commit -m "Apply R1 Foundation deterministic-spine remediation [r1-applied]"
          git push
