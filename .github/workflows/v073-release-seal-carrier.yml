name: AIR v0.7.3 release-seal carrier

on:
  push:
    branches:
      - release/v0.7.3-seal
    paths:
      - '.tmp-v073-release-seal-trigger'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned base and helper-only pre-carrier scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=9889585f2088fdc631a759567d7433f62c5aea87
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          printf '%s\n' \
            '.github/workflows/v073-release-seal-carrier.yml' \
            '.tmp-v073-release-seal-trigger' \
            '.tmp-v073-release-seal.py' | sort > /tmp/pre-expected.txt
          git diff --name-only "$BASE"..HEAD | sort > /tmp/pre-actual.txt
          diff -u /tmp/pre-expected.txt /tmp/pre-actual.txt
          test -z "$(git ls-files --others --exclude-standard)"
          echo 'Pinned base + helper-only pre-carrier scope: PASS'

      - name: Construct v0.7.3 release-sealed source candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp-v073-release-seal.py

      - name: Verify exact approved working product scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=9889585f2088fdc631a759567d7433f62c5aea87
          printf '%s\n' \
            'README.md' \
            'catalog/AIR_SPECIALIST_PACKAGE_INDEX.json' \
            'tools/test_air_r7_mutations.py' \
            'tools/test_air_v073_release_seal_mutations.py' \
            'tools/validate_air_r7_remediation.py' \
            'tools/validate_air_v073_release_seal.py' | sort > /tmp/product-expected.txt
          git diff --name-only "$BASE" -- . \
            ':!.github/workflows/v073-release-seal-carrier.yml' \
            ':!.tmp-v073-release-seal-trigger' \
            ':!.tmp-v073-release-seal.py' | sort > /tmp/product-actual.txt
          diff -u /tmp/product-expected.txt /tmp/product-actual.txt
          test "$(wc -l < /tmp/product-actual.txt)" -eq 6
          echo 'v0.7.3 release-seal product scope: PASS (6/6)'

      - name: Run complete canonical AIR validation and release-seal mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_air_suite.py | tee /tmp/full-suite.out
          grep -F 'AIR canonical validation suite: PASS' /tmp/full-suite.out
          grep -F 'AIR v0.7.3 release-seal validation: PASS' /tmp/full-suite.out
          grep -F 'AIR R7 remediation mutation suite: PASS (62/62 targeted mutants killed)' /tmp/full-suite.out
          grep -F 'AIR v0.7.3 release-seal mutation suite: PASS (51/51 targeted mutants killed)' /tmp/full-suite.out
          grep -F 'Implemented deterministic checks: 90/90' /tmp/full-suite.out
          grep -F 'Executed deterministic checks: 90/90' /tmp/full-suite.out

      - name: Remove helpers and enforce final six-path scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=9889585f2088fdc631a759567d7433f62c5aea87
          rm -f .github/workflows/v073-release-seal-carrier.yml
          rm -f .tmp-v073-release-seal-trigger .tmp-v073-release-seal.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --name-only "$BASE" | sort > /tmp/final-actual.txt
          diff -u /tmp/product-expected.txt /tmp/final-actual.txt
          test "$(wc -l < /tmp/final-actual.txt)" -eq 6
          echo 'Final v0.7.3 release-seal scope + untracked hygiene: PASS (6/6)'

      - name: Commit and push validated product-only seal carrier
        shell: bash
        run: |
          set -euo pipefail
          BASE=9889585f2088fdc631a759567d7433f62c5aea87
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: seal AIR Kit v0.7.3 source'
          git diff --name-only "$BASE"..HEAD | sort > /tmp/postcommit-actual.txt
          diff -u /tmp/product-expected.txt /tmp/postcommit-actual.txt
          git push
          echo "CARRIER_HEAD=$(git rev-parse HEAD)"
          echo "CARRIER_TREE=$(git rev-parse HEAD^{tree})"
          sha256sum catalog/AIR_SPECIALIST_PACKAGE_INDEX.json
          sha256sum README.md
