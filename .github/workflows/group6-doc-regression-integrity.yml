name: Group 6 documentation regression integrity

on:
  push:
    branches:
      - agent/group6-doc-regression-integrity

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch documentation and extend deterministic assertions
        run: python3 .github/tmp/group6_doc_regression_integrity.py

      - name: Remove temporary Group 6 tooling
        run: |
          rm .github/tmp/group6_doc_regression_integrity.py
          rm .github/workflows/group6-doc-regression-integrity.yml

      - name: Commit focused Group 6 patch
        run: |
          git config user.name "AIR repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/AIR_DRIFT_REGRESSION_MATRIX.md \
            docs/AIR_HANDOFF_SCHEMA_COMPATIBILITY_HOTFIX.md \
            docs/AIR_RUNTIME_DRIFT_HARDENING.md \
            tests/air-test-manifest.json \
            .github/tmp/group6_doc_regression_integrity.py \
            .github/workflows/group6-doc-regression-integrity.yml
          git diff --cached --check
          git commit -m "Group 6: align documentation regression integrity"
          git push
