name: Apply AIR v0.7.2 cognitive-scope authority isolation

on:
  push:
    branches: [v0.7.2-full-repo-hardening]

permissions:
  contents: write

jobs:
  apply-v072-cognitive-scope:
    if: ${{ contains(github.event.head_commit.message, '[v072-cognitive-scope-run]') }}
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BASE=68a934869592845c6960d3ad2498802ca2ed82da
          test "$(git rev-parse "$BASE^{tree}")" = 7cd6b6cff893a8686cfaa4ba5ba2de9180bd059e
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"..HEAD | sort > /tmp/actual
          printf '%s\n' '.github/workflows/v072-cognitive-scope-apply.yml' 'tools/apply_v072_cognitive_scope.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(git ls-tree -r --name-only "$BASE" | wc -l)" -eq 99

      - name: Repair temporary executor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          starter=json.loads(Path('prompts/AIR_DEFAULT_STARTER_PROFILE.json').read_text())
          card=json.loads(Path('prompts/AIR_HANDOFF_CARD_TEMPLATE.json').read_text())['AIR_HANDOFF_CARD']
          assert starter['PROMPT_VERSION']=='2.6.1' and len(starter['validation_contract']['deterministic_contract_registry']['checks'])==80
          assert 'mii_cognitive_routing' in starter['routing_contracts'] and card['card_revision']==17 and 'rules' in card['migration_state']
          p=Path('tools/apply_v072_cognitive_scope.py'); t=p.read_text(encoding='utf-8')
          for old,new in [
            ("cr = h['migration_state']['compatibility_rules']", "cr = h['migration_state']['rules']"),
            ("mii = cc['mii_cognitive_routing']", "mii = o['routing_contracts']['mii_cognitive_routing']"),
          ]:
            if old in t:
              assert t.count(old)==1; t=t.replace(old,new,1)
            else: assert t.count(new)==1
          bad="\\n    require(starter.get('compiler_contract', {}).get('cognitive_scope_authority_isolation', {}).get('required') is True, 'Starter cognitive scope contract missing')\\n"
          if bad in t: assert t.count(bad)==1; t=t.replace(bad,"\\n",1)
          anchor="    p.write_text(t, encoding='utf-8')\n\n\ndef patch_r7_validator(root: Path) -> None:\n"
          if 'release Starter cognitive check' not in t:
            assert t.count(anchor)==1
            ins=("    starter_marker = \"    require(starter['PROMPT_VERSION'] == '2.6.2', 'Starter version mismatch')\\n\"\n"
                 "    starter_extra = starter_marker + \"    require(starter.get('compiler_contract', {}).get('cognitive_scope_authority_isolation', {}).get('required') is True, 'Starter cognitive scope contract missing')\\n\"\n"
                 "    if 'Starter cognitive scope contract missing' not in t:\n"
                 "        t = replace_once(t, starter_marker, starter_extra, 'release Starter cognitive check')\n"+anchor)
            t=t.replace(anchor,ins,1)
          r1="    if not any(x.get('id') == 'R1-N15-COGNITIVE-SCOPE-FLOOR-MISSING' for x in r1['negative_cases']):\n        r1['negative_cases'].append({'id':'R1-N15-COGNITIVE-SCOPE-FLOOR-MISSING','mutation':'remove AIR-FLOOR-028 canonical identifier from Core','must_fail':'DC-CORE-FLOOR-028'})\n"
          if r1 in t: assert t.count(r1)==1; t=t.replace(r1,'',1)
          old="def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if old == new:\n        return text\n    if old in text:\n        if text.count(old) != 1:\n            raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')\n        return text.replace(old, new, 1)\n    if new in text:\n        return text\n    raise SystemExit(f'{label}: missing old/new anchor')\n"
          new="def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if old == new:\n        return text\n    if new in text:\n        return text\n    if old in text:\n        if text.count(old) != 1:\n            raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')\n        return text.replace(old, new, 1)\n    raise SystemExit(f'{label}: missing old/new anchor')\n"
          if old in t: assert t.count(old)==1; t=t.replace(old,new,1)
          else: assert t.count(new)==1
          old="    t = t.replace(OLD_FOUNDATION, NEW_FOUNDATION).replace(OLD_SHORT, NEW_SHORT).replace(OLD_SET, NEW_SET)\n"
          new="    if NEW_FOUNDATION not in t:\n        t = t.replace(OLD_FOUNDATION, NEW_FOUNDATION).replace(OLD_SHORT, NEW_SHORT).replace(OLD_SET, NEW_SET)\n"
          if old in t: assert t.count(old)==1; t=t.replace(old,new,1)
          else: assert t.count(new)==1
          p.write_text(t,encoding='utf-8')
          PY
          python3 -m py_compile tools/apply_v072_cognitive_scope.py

      - name: Apply SET_007 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/history-before
          import json
          from pathlib import Path
          c=json.loads(Path('profiles/capability ecology architect/AIR_CAPABILITY_ECOLOGY_ARCHITECT_PACKAGE_MANIFEST.json').read_text())
          i=json.loads(Path('catalog/AIR_SPECIALIST_PACKAGE_INDEX.json').read_text())
          print(json.dumps([c['t7_change_record'],i['catalog_scope']['historical_release_catalogs']],sort_keys=True))
          PY
          python3 tools/apply_v072_cognitive_scope.py .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_air_r3_remediation.py'); t=p.read_text()
          a="    req(visibility_valid(H),'016 baseline visibility authority invalid')\n"
          b=a+"    cs=H['execution_state']['cognitive_scope_state']; req(cs.get('positive_execution_authority')=='NONE','v072 Handoff cognitive scope gained authority'); req(cs.get('validation_ingress_state')=='NOT_EVALUATED','v072 Handoff cognitive scope baseline fabricated validation'); req(H['mii_state'].get('cognitive_scope_ref')=='AIR_HANDOFF_CARD.execution_state.cognitive_scope_state','v072 Handoff cognitive scope ref mismatch')\n"
          if 'v072 Handoff cognitive scope gained authority' not in t: assert t.count(a)==1; t=t.replace(a,b,1)
          p.write_text(t)
          p=Path('tools/validate_air_release.py'); t=p.read_text(); old='AIR v0.7.2 set-006 candidate deterministic validation: PASS'; new='AIR v0.7.2 set-007 candidate deterministic validation: PASS'
          if old in t: assert t.count(old)==1; t=t.replace(old,new,1)
          else: assert t.count(new)==1
          p.write_text(t)
          PY
          python3 tools/reseal_air_candidate.py --apply
          python3 - <<'PY' > /tmp/history-after
          import json
          from pathlib import Path
          c=json.loads(Path('profiles/capability ecology architect/AIR_CAPABILITY_ECOLOGY_ARCHITECT_PACKAGE_MANIFEST.json').read_text())
          i=json.loads(Path('catalog/AIR_SPECIALIST_PACKAGE_INDEX.json').read_text())
          print(json.dumps([c['t7_change_record'],i['catalog_scope']['historical_release_catalogs']],sort_keys=True))
          PY
          diff -u /tmp/history-before /tmp/history-after

      - name: Validate SET_007 candidate
        run: |
          python3 tools/validate_air_r1_remediation.py .
          python3 tools/validate_air_r3_remediation.py .
          python3 tools/validate_air_r7_remediation.py .
          python3 tools/validate_air_control_plane.py
          python3 tools/validate_air_behavioral_contracts.py
          python3 tools/validate_air_boot.py
          python3 tools/validate_air_release.py
          python3 tools/validate_air_v072_release_seal.py
          python3 tools/validate_air_suite.py

      - name: Verify patch fixed point
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reseal_air_candidate.py --check
          git diff -- . ':(exclude)tools/apply_v072_cognitive_scope.py' ':(exclude).github/workflows/v072-cognitive-scope-apply.yml' > /tmp/before
          python3 tools/apply_v072_cognitive_scope.py .
          python3 tools/reseal_air_candidate.py --apply
          git diff -- . ':(exclude)tools/apply_v072_cognitive_scope.py' ':(exclude).github/workflows/v072-cognitive-scope-apply.yml' > /tmp/after
          diff -u /tmp/before /tmp/after
          python3 tools/reseal_air_candidate.py --check
          python3 tools/validate_air_v072_release_seal.py

      - name: Reconcile all 99 tracked files
        shell: bash
        run: |
          set -euo pipefail
          BASE=68a934869592845c6960d3ad2498802ca2ed82da
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm -f tools/apply_v072_cognitive_scope.py .github/workflows/v072-cognitive-scope-apply.yml
          git add -A
          git ls-tree -r --name-only "$BASE" | sort > /tmp/base-files
          git ls-files | sort > /tmp/final-files
          diff -u /tmp/base-files /tmp/final-files
          test "$(wc -l < /tmp/final-files)" -eq 99
          python3 - <<'PY'
          import subprocess
          base='68a934869592845c6960d3ad2498802ca2ed82da'
          files=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          direct={'README.md','prompts/AIR_CONTROL_SURFACE.md','prompts/AIR_CORE_RUNTIME.md','prompts/AIR_DEFAULT_STARTER_PROFILE.json','prompts/AIR_GOV.md','prompts/AIR_HANDOFF_CARD_TEMPLATE.json','tests/air_contract_fixtures.json','tests/deterministic_contract_inventory.json','tests/r1_remediation_fixtures.json','tests/r3_remediation_fixtures.json','tools/migrate_air_handoff.py','tools/test_air_behavioral_contract_mutations.py','tools/test_air_control_plane_mutations.py','tools/test_air_r3_mutations.py','tools/test_air_v072_release_seal_mutations.py','tools/validate_air_behavioral_contracts.py','tools/validate_air_boot.py','tools/validate_air_control_plane.py','tools/validate_air_r1_remediation.py','tools/validate_air_r3_remediation.py','tools/validate_air_r7_remediation.py','tools/validate_air_release.py','tools/validate_air_v072_release_seal.py'}
          generated={'catalog/AIR_RUNTIME_ROUTE_MAP.json'}
          compat={'catalog/AIR_SPECIALIST_PACKAGE_INDEX.json'}|{x for x in files if x.startswith('profiles/')}
          validation={'.github/workflows/air-reproducibility.yml','tests/r4_remediation_fixtures.json','tests/r5_remediation_fixtures.json','tools/refresh_r8_route_anchors.py','tools/reseal_air_candidate.py','tools/test_air_contract_registry_mutations.py','tools/test_air_r1_mutations.py','tools/test_air_r2_mutations.py','tools/test_air_r4_mutations.py','tools/test_air_r5_mutations.py','tools/test_air_r6_mutations.py','tools/test_air_r7_mutations.py','tools/test_air_r8_mutations.py','tools/test_air_validator_mutations.py','tools/validate_air_contract_registry.py','tools/validate_air_r2_remediation.py','tools/validate_air_r4_remediation.py','tools/validate_air_r5_remediation.py','tools/validate_air_r6_remediation.py','tools/validate_air_r8_remediation.py','tools/validate_air_suite.py'}
          nochange={'.gitattributes','.gitignore','LICENSE','NOTICE','VERSION','.github/workflows/r1-remediation-apply.yml','.github/workflows/r2-remediation-apply.yml','.github/workflows/r3-remediation-apply.yml','.github/workflows/r4-remediation-apply.yml','.github/workflows/r5-remediation-apply.yml','.github/workflows/r6-remediation-apply.yml','.github/workflows/r7-remediation-apply.yml','.github/workflows/r8-remediation-apply.yml','tests/r5_run_trigger.txt','tests/r6_run_trigger.txt','tests/r7_run_trigger.txt','tests/r8_run_trigger.txt','tools/apply_r1_remediation.py','tools/apply_r2_remediation.py','tools/apply_r3_remediation.py','tools/apply_r4_remediation.py','tools/apply_r5_remediation.py','tools/apply_r6_remediation.py','tools/apply_r7_remediation.py','tools/apply_r8_remediation.py','tools/patch_r8_validator_extensions.py','tools/patch_validate_air_release_r7.py','tools/test_air_v071_release_seal_mutations.py','tools/validate_air_v071_release_seal.py'}
          groups=[direct,generated,compat,validation,nochange]
          assert [len(x) for x in groups]==[23,1,25,21,29]
          assert set().union(*groups)==files
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines())
          assert changed <= direct|generated|compat, sorted(changed-(direct|generated|compat))
          assert direct <= changed and generated <= changed
          assert not(changed&validation) and not(changed&nochange)
          print('Full repository reconciliation: PASS')
          print('tracked=99 reconciled=99 unclassified=0')
          print('dispositions direct=23 generated=1 compatibility=25 validation_only=21 no_change=29')
          print('net_changed_files',len(changed))
          PY

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: isolate cognitive scope authority in AIR v0.7.2 [v072-cognitive-scope-applied]'
          git push
