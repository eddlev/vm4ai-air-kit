name: Group 4 Governance reseal

on:
  push:
    branches:
      - agent/group4-governance-reseal
    paths:
      - .github/tmp/group4_governance_reseal.py
      - .github/workflows/group4-governance-reseal.yml

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct nested Handoff schema lookup in temporary reseal script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp/group4_governance_reseal.py')
          text = path.read_text(encoding='utf-8')
          old = 'observed = obj.get("schema_version")'
          new = 'observed = obj.get("AIR_HANDOFF_CARD", {}).get("schema_version")'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Handoff schema lookup, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Reseal AI Governance package against current main foundation
        run: python3 .github/tmp/group4_governance_reseal.py

      - name: Remove temporary reseal tooling
        run: |
          rm .github/tmp/group4_governance_reseal.py
          rm .github/workflows/group4-governance-reseal.yml

      - name: Commit focused Group 4 patch
        run: |
          git config user.name "AIR repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "profiles/governance specialist/AIR_AI_GOVERNANCE_DOMAIN_PACKAGE.json" \
            "profiles/governance specialist/AIR_AI_GOVERNANCE_AGENTIC_OVERLAY.json" \
            "profiles/governance specialist/AIR_AI_GOVERNANCE_SPECIALIST.json" \
            "profiles/governance specialist/AIR_AI_GOVERNANCE_METHOD_PACK.json" \
            "profiles/governance specialist/AIR_AI_GOVERNANCE_EXECUTOR.json" \
            "profiles/governance specialist/AIR_AI_GOVERNANCE_SPECIALIST_PACKAGE_MANIFEST.json" \
            tests/air-test-manifest.json \
            .github/tmp/group4_governance_reseal.py \
            .github/workflows/group4-governance-reseal.yml
          git diff --cached --check
          git commit -m "Group 4: reseal AI Governance package"
          git push
