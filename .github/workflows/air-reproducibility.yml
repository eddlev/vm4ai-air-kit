name: AIR public distribution integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  v081-source-and-runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AIR v0.8.1 canonical validation suite
        run: python3 tools/validate_air_suite.py
