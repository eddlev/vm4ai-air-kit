name: AIR public distribution integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canonical AIR validation suite
        run: python3 tools/validate_air_suite.py
