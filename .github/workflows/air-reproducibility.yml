name: AIR public distribution integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canonical AIR candidate validation suite
        if: github.event_name == 'pull_request'
        run: python3 tools/validate_air_suite.py --candidate

      - name: Canonical AIR exact-release validation suite
        if: github.event_name == 'push'
        run: python3 tools/validate_air_suite.py
