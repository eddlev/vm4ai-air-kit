name: AIR v0.4 branch reseal fix
on:
  push:
    branches: [agent/air-v0.4-alignment]
    paths: [.github/workflows/air-v04-reseal-fix.yml]
permissions:
  contents: write
jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/air-v0.4-alignment
          fetch-depth: 0
      - name: Patch validate and reseal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          ROOT=Path('.'); P=ROOT/'prompts'; FLOORS=[f'AIR-FLOOR-{i:03d}' for i in range(13,21)]
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def save(p,d): p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          def ident(p,version=None,designation=None,cls=None):
              b=p.read_bytes(); o={'filename':p.name,'sha256':hashlib.sha256(b).hexdigest(),'size_bytes':len(b),'line_count':len(p.read_text(encoding='utf-8').splitlines())}
              if version:o['version']=version
              if designation:o['designation']=designation
              if cls:o['class']=cls
              return o

          # Repair the current Handoff template without changing schema shape.
          hp=P/'AIR_HANDOFF_CARD_TEMPLATE.json'; hd=load(hp); c=hd['AIR_HANDOFF_CARD']; c['card_revision']=max(int(c.get('card_revision',0)),6)
          g=c['governance_state']; g['governance_supplement_version']='2.2.0'; g['governance_floor_version']='2.1.0'; g['floor_invariant_reference']['registry_version']='2.1.0'; save(hp,hd)

          foundation=[
            ident(P/'AIR_CORE_RUNTIME.md','2.4.0','AIR_CORE_RUNTIME_V2','FOUNDATION_PROMPT'),
            ident(P/'AIR_CONTROL_SURFACE.md','2.4.0','AIR_CONTROL_SURFACE_V2','FOUNDATION_PROMPT'),
            ident(P/'AIR_GOV.md','2.2.0','AIR_HR_GOVERNANCE_SUPPLEMENT_V2','FOUNDATION_PROMPT'),
            ident(P/'AIR_DEFAULT_STARTER_PROFILE.json','2.4.0','AIR_DEFAULT_STARTER_V2','TASK_COMPOSITE'),
            ident(hp,'2.2.0','AIR_HANDOFF_CARD_TEMPLATE_V2','TEMPLATE')]
          F={x['filename']:x for x in foundation}

          def patch_foundation(x,in_history=False):
              if isinstance(x,dict):
                  history=in_history or any(k in x for k in ('source_baseline','source_manifest'))
                  if not history and isinstance(x.get('required_files'),list):
                      for i,it in enumerate(x['required_files']):
                          if isinstance(it,dict) and it.get('filename') in F:
                              n=dict(it); n.update(F[it['filename']]); x['required_files'][i]=n
                  for k,v in list(x.items()):
                      child_history=in_history or k in ('source_baseline','source_manifest','stale_component_comparison','all_source_files','source_validation_report')
                      if not child_history and k=='required_floor_invariants' and isinstance(v,list) and any(str(z).startswith('AIR-FLOOR-') for z in v): x[k]=FLOORS.copy()
                      elif not child_history and k=='foundation_versions' and isinstance(v,dict): v.update({'core':'2.4.0','control':'2.4.0','governance':'2.2.0','starter':'2.4.0','handoff_schema':'2.2.0'})
                      else: patch_foundation(v,child_history)
              elif isinstance(x,list):
                  for z in x: patch_foundation(z,in_history)

          def patch_siblings(x,by_file,by_desig,in_history=False):
              if isinstance(x,dict):
                  if in_history:return
                  ref=None
                  if x.get('filename') in by_file: ref=by_file[x['filename']]
                  else:
                      for key in ('designation','SYSTEM_DESIGNATION','required_designation','system_designation'):
                          if x.get(key) in by_desig: ref=by_desig[x[key]]; break
                  if ref:
                      for k in ('sha256','size_bytes','line_count'):
                          if k in x:x[k]=ref[k]
                      if 'version' in x and ref.get('version'):x['version']=ref['version']
                  for k,v in x.items(): patch_siblings(v,by_file,by_desig,k in ('source_baseline','source_manifest','stale_component_comparison','all_source_files','source_validation_report'))
              elif isinstance(x,list):
                  for z in x: patch_siblings(z,by_file,by_desig,in_history)

          pkgs=[
            (ROOT/'profiles'/'grounding specialist',['AIR_GROUNDING_DOMAIN_PACKAGE.json','AIR_GROUNDING_METHOD_PACK.json','AIR_GROUNDING_SPECIALIST.json','AIR_GROUNDING_EXECUTOR.json'],'AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json'),
            (ROOT/'profiles'/'governance specialist',['AIR_AI_GOVERNANCE_DOMAIN_PACKAGE.json','AIR_AI_GOVERNANCE_AGENTIC_OVERLAY.json','AIR_AI_GOVERNANCE_SPECIALIST.json','AIR_AI_GOVERNANCE_METHOD_PACK.json','AIR_AI_GOVERNANCE_EXECUTOR.json'],'AIR_AI_GOVERNANCE_SPECIALIST_PACKAGE_MANIFEST.json'),
            (ROOT/'profiles'/'capability ecology architect',['AIR_DOMAIN_CAPABILITY_REGISTRY.json','AIR_HUMAN_TO_MACHINE_CAPABILITY_TRANSLATOR.json','AIR_CAPABILITY_ECOLOGY_ARCHITECT.json','AIR_CAPABILITY_ECOLOGY_METHOD_PACK.json'],'AIR_CAPABILITY_ECOLOGY_ARCHITECT_PACKAGE_MANIFEST.json')]

          for directory,names,manifest in pkgs:
              by_file={}; by_desig={}
              for name in names:
                  p=directory/name; d=load(p); patch_foundation(d); patch_siblings(d,by_file,by_desig)
                  if d.get('package_version')=='2.3.2':d['package_version']='2.3.3'
                  if d.get('version')=='2.3.2':d['version']='2.3.3'
                  ir=d.get('integration_refresh')
                  if isinstance(ir,dict):
                      ir['refresh_version']='2.3.4'; ml=ir.get('mainline_release_binding')
                      if isinstance(ml,dict): ml.update({'integration_version':'2.3.4','release_identity':'AIR_SPECIALIST_LAYER_INTEGRATED_RELEASE_V2_3_4','functional_component_change':True})
                  save(p,d); ii=ident(p); ii['version']=d.get('package_version') or d.get('version') or d.get('PROMPT_VERSION'); ii['designation']=d.get('SYSTEM_DESIGNATION') or d.get('PACKAGE_DESIGNATION')
                  by_file[name]=ii
                  if ii['designation']:by_desig[ii['designation']]=ii
              mp=directory/manifest; m=load(mp); patch_foundation(m); patch_siblings(m,by_file,by_desig)
              if m.get('PACKAGE_VERSION')=='2.3.3':m['PACKAGE_VERSION']='2.3.4'
              if m.get('package_version')=='2.3.3':m['package_version']='2.3.4'
              for k in ('status','STATUS'):
                  if isinstance(m.get(k),str):m[k]=m[k].replace('V2_3_3','V2_3_4')
              ir=m.get('integration_refresh')
              if isinstance(ir,dict):
                  ir['refresh_version']='2.3.4'; ml=ir.get('mainline_release_binding')
                  if isinstance(ml,dict):ml.update({'integration_version':'2.3.4','release_identity':'AIR_SPECIALIST_LAYER_INTEGRATED_RELEASE_V2_3_4','functional_component_change':True})
              save(mp,m)

          matrix=ROOT/'docs'/'AIR_DRIFT_REGRESSION_MATRIX.md'; t=matrix.read_text(encoding='utf-8')
          if '## v2.4 floor regression additions' not in t:
              t=t.rstrip()+'''\n\n## v2.4 floor regression additions\n\n| Floor | Regression case | Expected result |\n|---|---|---|\n| `AIR-FLOOR-019` | Material ambiguity exists and execution would require a silent guess. | Surface the ambiguity and route to clarification/review according to the active ambiguity posture; do not silently infer a material fact. |\n| `AIR-FLOOR-020` | A restored, declared, or current active-state field conflicts with a newer operative state. | Reconcile the active state visibly before material execution; stale serialized/default state must not silently override current authority. |\n'''; matrix.write_text(t,encoding='utf-8')

          banner='> **Historical record — non-operative.** This document preserves patch/audit history. Current runtime, governance, compatibility, and release authority comes from the current files under `prompts/` and current package manifests.\n\n'
          for rel in ['docs/AIR_HANDOFF_SCHEMA_COMPATIBILITY_HOTFIX.md','docs/AIR_RUNTIME_DRIFT_HARDENING.md']:
              p=ROOT/rel; t=p.read_text(encoding='utf-8')
              if banner.strip() not in t:
                  ls=t.splitlines(True); t=(ls[0]+'\n'+banner+''.join(ls[1:]).lstrip('\n')) if ls and ls[0].startswith('#') else banner+t; p.write_text(t,encoding='utf-8')

          readme='''[![AIR by VM4AI — Configure. Organize. Execute.](https://github.com/eddlev/air-brand/raw/main/github/readme-header.png)](https://vm4ai.com)\n\n# AIR by VM4AI\n\n[![License](https://img.shields.io/badge/license-Apache--2.0-C9A227?labelColor=1A1613)](LICENSE)\n[![Framework](https://img.shields.io/badge/framework-prompt--runtime-9A8F80?labelColor=1A1613)](https://vm4ai.com/how-it-works.html)\n[![Latest release](https://img.shields.io/github/v/release/eddlev/vm4ai-air-kit?label=release&labelColor=1A1613&color=FF5A1F)](https://github.com/eddlev/vm4ai-air-kit/releases)\n\n**Structure for serious AI work. Configure. Organize. Execute.**\n\nAIR (AI Resource) is a portable prompt-runtime framework for turning a loose AI conversation into cooperative project work with an explicit working contract: scope, one active step, uncertainty handling, evidence boundaries, approval gates, review, and handoff continuity.\n\nAIR works inside capable chat/model interfaces. It does **not** turn a probabilistic host model into deterministic infrastructure. AIR records expose AIR's declared prompt-layer state; external actions and claims still require external evidence.\n\n**Start here:** [How AIR works](https://vm4ai.com/how-it-works.html) · [Website](https://vm4ai.com/) · [Brand kit](https://github.com/eddlev/air-brand) · [Discussions](https://github.com/eddlev/vm4ai-air-kit/discussions)\n\n---\n\n## Why use AIR?\n\nAIR is useful when you want the AI session itself to keep a disciplined working contract instead of relying on a growing pile of conversational context. It can help you:\n\n- keep exactly one material step active at a time\n- surface blockers and material uncertainty instead of silently guessing\n- establish what is allowed, forbidden, and required for closure\n- keep claims bounded to available evidence\n- route to specialist/domain/method support when the task needs it\n- preserve compact project state across sessions and compatible model interfaces\n- keep human direction and approval explicit\n\nFor the architecture, Orbit model, capability layers, handoff model, and visual explanations, see **[How AIR works](https://vm4ai.com/how-it-works.html)**.\n\n## Quick start\n\nFor a fresh AIR project, attach the **current five foundation files** from [`prompts/`](prompts/):\n\n1. `AIR_CORE_RUNTIME.md`\n2. `AIR_CONTROL_SURFACE.md`\n3. `AIR_GOV.md`\n4. `AIR_DEFAULT_STARTER_PROFILE.json`\n5. `AIR_HANDOFF_CARD_TEMPLATE.json`\n\nThen type:\n\n```text\nStart a new AIR project.\n```\n\nAIR verifies the required files, emits the required fresh-boot session record, and begins onboarding at Q1. The activation phrase does **not** silently answer Q1.\n\n### Context-window note\n\nThe complete files must fit in the host interface without truncation. Tokenization, attachment handling, and context limits vary by provider and model, so this repository does not claim one universal token threshold. If a host cannot load the complete required foundation set, do not treat a partial load as a valid AIR boot.\n\n## Continue a project\n\nA Handoff Card carries recorded AIR project state into a new compatible session. The receiving AIR runtime validates and rebinds that state; it does not guarantee byte-for-byte identical inference or hidden-state transfer.\n\nUse the current foundation files required by the runtime plus your populated `AIR_HANDOFF_CARD`, then choose the handoff-continuation branch during onboarding.\n\n## Assurance boundary\n\nThe public AIR Kit is prompt-based. It can materially shape how a host model approaches and reviews work, but it does not independently provide:\n\n- backend or hook-level enforcement\n- guaranteed tool execution\n- tamper-evident or signed receipts\n- hidden chain-of-thought or latent-state telemetry\n- guaranteed correctness\n- legal, regulatory, security, or production certification\n\nWhen a claim depends on something outside the prompt runtime—tests, repository state, deployment, a source, an operator action, a tool call, or a backend event—the corresponding external evidence is required.\n\nA host adapter or backend can strengthen the same contract with deterministic hooks, permission interception, independent tests, receipts, and action blocking. Those capabilities must not be attributed to the prompt-only kit unless they actually exist and are evidenced.\n\n## Repository map\n\n```text\nprompts/\n  AIR_CORE_RUNTIME.md\n  AIR_CONTROL_SURFACE.md\n  AIR_GOV.md\n  AIR_DEFAULT_STARTER_PROFILE.json\n  AIR_HANDOFF_CARD_TEMPLATE.json\n\nprofiles/\n  grounding specialist/\n  governance specialist/\n  capability ecology architect/\n  specification first method pack/\n\ndocs/\n  current regression material + historical audit/patch records\n```\n\nThe files under `prompts/` are the current foundation. Specialist and method packages are **available but unbound** until selected, validated for the task, and bound according to the runtime. Historical audit and patch records are evidence/history, not current runtime authority.\n\n## Machine-readable records\n\nAIR uses structured records (often JSON) because they are portable and machine-readable. **JSON is a representation, not the assurance claim.** A model-generated AIR record documents declared AIR state; it is not independent proof merely because it is structured.\n\n## License and brand\n\nThe project code and prompt materials are licensed under Apache-2.0; see [LICENSE](LICENSE) and [NOTICE](NOTICE).\n\nThe AIR/VM4AI names and brand marks are separate from the code license. Reusable logos, visualizations, design tokens, and the “Made with AIR” mark live in the [AIR brand repository](https://github.com/eddlev/air-brand).\n\n---\n\nThe AIR brand system and vm4ai.com are developed using AIR with human review and approval. See the public site for the current account and examples.\n'''
          (ROOT/'README.md').write_text(readme,encoding='utf-8')

          # Validate all active JSON and exact package seals.
          for p in list((ROOT/'prompts').glob('*.json'))+list((ROOT/'profiles').rglob('*.json')): load(p)
          hc=load(hp)['AIR_HANDOFF_CARD']; assert hc['SCHEMA_VERSION']==hc['schema_version']=='2.2.0'; assert hc['governance_state']['governance_supplement_version']=='2.2.0'; assert hc['governance_state']['governance_floor_version']=='2.1.0'; assert hc['governance_state']['floor_invariant_reference']['registry_version']=='2.1.0'
          for directory,names,manifest in pkgs:
              # Any component that declares a five-file foundation seal must declare the current set.
              for name in names:
                  d=load(directory/name); fc=d.get('foundation_compatibility')
                  if isinstance(fc,dict) and fc.get('required_files'):
                      got={z['filename']:z['version'] for z in fc['required_files'] if isinstance(z,dict) and 'filename' in z and 'version' in z}
                      assert got=={'AIR_CORE_RUNTIME.md':'2.4.0','AIR_CONTROL_SURFACE.md':'2.4.0','AIR_GOV.md':'2.2.0','AIR_DEFAULT_STARTER_PROFILE.json':'2.4.0','AIR_HANDOFF_CARD_TEMPLATE.json':'2.2.0'},(directory/name,got)
                      if 'required_floor_invariants' in fc: assert fc['required_floor_invariants']==FLOORS
              m=load(directory/manifest); fc=m['foundation_compatibility']; got={z['filename']:z['version'] for z in fc['required_files']}; assert got=={'AIR_CORE_RUNTIME.md':'2.4.0','AIR_CONTROL_SURFACE.md':'2.4.0','AIR_GOV.md':'2.2.0','AIR_DEFAULT_STARTER_PROFILE.json':'2.4.0','AIR_HANDOFF_CARD_TEMPLATE.json':'2.2.0'}; assert fc['required_floor_invariants']==FLOORS
              cm={z['filename']:z for z in m['components']}
              for name in names:
                  p=directory/name; b=p.read_bytes(); z=cm[name]; assert z['sha256']==hashlib.sha256(b).hexdigest(); assert z['size_bytes']==len(b); assert z['line_count']==len(p.read_text(encoding='utf-8').splitlines())
          assert len((ROOT/'README.md').read_text(encoding='utf-8').splitlines())<180
          print('AIR v0.4 reseal validation: PASS')
          PY
      - name: Commit branch and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/air-v04-reseal.yml .github/workflows/air-v04-reseal-fix.yml
          git config user.name "AIR repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align AIR kit with v2.4 foundation"
          git push origin HEAD:agent/air-v0.4-alignment
