name: Group 3 Grounding reseal

on:
  push:
    branches:
      - agent/group3-grounding-reseal

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reseal Grounding package against current main foundation
        run: python3 .github/tmp/group3_grounding_reseal.py

      - name: Remove temporary reseal tooling
        run: |
          rm .github/tmp/group3_grounding_reseal.py
          rm .github/workflows/group3-grounding-reseal.yml

      - name: Commit focused Group 3 patch
        run: |
          git config user.name "AIR repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "profiles/grounding specialist/AIR_GROUNDING_DOMAIN_PACKAGE.json" \
            "profiles/grounding specialist/AIR_GROUNDING_METHOD_PACK.json" \
            "profiles/grounding specialist/AIR_GROUNDING_SPECIALIST.json" \
            "profiles/grounding specialist/AIR_GROUNDING_EXECUTOR.json" \
            "profiles/grounding specialist/AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json" \
            tests/air-test-manifest.json \
            .github/tmp/group3_grounding_reseal.py \
            .github/workflows/group3-grounding-reseal.yml
          git diff --cached --check
          git commit -m "Group 3: reseal Grounding package"
          git push
