name: Grounding SET_008 behavioral carrier

on:
  push:
    branches:
      - air/grounding-set008-behavioral
    paths:
      - .tmp-grounding-set008-behavioral-trigger

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned base and authorized pre-carrier scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=d79602ecba8b7092102afcd35f77a606b27548a6
          git merge-base --is-ancestor "$BASE" HEAD
          printf '%s\n' \
            '.github/workflows/grounding-set008-behavioral-carrier.yml' \
            '.tmp-grounding-set008-behavioral-trigger' \
            'tests/AIR_GROUNDING_SET008_BEHAVIORAL_EVIDENCE_V1.json' | sort > /tmp/pre-expected.txt
          git diff --name-only "$BASE"..HEAD | sort > /tmp/pre-actual.txt
          diff -u /tmp/pre-expected.txt /tmp/pre-actual.txt
          test -z "$(git ls-files --others --exclude-standard)"
          echo 'Pinned base + pre-carrier scope: PASS'

      - name: Construct candidate and update behavioral validators
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HELPER_COMMIT=a768e23c2db100ccd9e43e24ae1ea807acb283a3
          git show "$SOURCE_HELPER_COMMIT:.github/workflows/grounding-set008-behavioral-carrier.yml" > /tmp/source-carrier.yml
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          s = Path('/tmp/source-carrier.yml').read_text(encoding='utf-8')
          marker = "          cat > /tmp/grounding_behavioral_promote.py <<'PY'\n"
          start = s.index(marker) + len(marker)
          end = s.index("\n          PY\n", start)
          body = s[start:end]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/grounding_behavioral_promote.py').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PYEXTRACT
          python3 /tmp/grounding_behavioral_promote.py
          python3 - <<'PYPATCH'
          from pathlib import Path
          p=Path('tools/validate_air_r7_remediation.py')
          s=p.read_text(encoding='utf-8')
          patches=[
            (
              "if 'behavioral_revalidation' in pvs:req(pvs['behavioral_revalidation']==(BEHAVIOR_PASS if (is_cw or is_sfv or is_cea or (GOV_DIR in str(p))) else BEHAVIOR_PENDING),f'{p}: behavioral validation state mismatch')",
              "if 'behavioral_revalidation' in pvs:req(pvs['behavioral_revalidation']==(BEHAVIOR_PASS if (is_ground or is_cw or is_sfv or is_cea or (GOV_DIR in str(p))) else BEHAVIOR_PENDING),f'{p}: behavioral validation state mismatch')",
              'shared behavioral manifest predicate'
            ),
            (
              "req(groundentry.get('availability_state')==PENDING_BEHAVIOR and groundentry.get('foundation_compatibility_identity')==FOUNDATION_ID,'Grounding index static promotion mismatch')",
              "req(groundentry.get('availability_state')==RELEASED and groundentry.get('foundation_compatibility_identity')==FOUNDATION_ID and groundentry.get('behavioral_revalidation_state')==BEHAVIOR_PASS and groundentry.get('executor_component_state')=='DRAFT_AVAILABLE_UNVALIDATED','Grounding index behavioral promotion mismatch')",
              'Grounding index behavioral promotion predicate'
            )
          ]
          for old,new,label in patches:
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected one anchor, observed {n}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PYPATCH

      - name: Verify Executor immutability and exact working product scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=d79602ecba8b7092102afcd35f77a606b27548a6
          git diff --quiet "$BASE" -- 'profiles/grounding specialist/AIR_GROUNDING_EXECUTOR.json'
          printf '%s\n' \
            'catalog/AIR_SPECIALIST_PACKAGE_INDEX.json' \
            'profiles/grounding specialist/AIR_GROUNDING_DOMAIN_PACKAGE.json' \
            'profiles/grounding specialist/AIR_GROUNDING_METHOD_PACK.json' \
            'profiles/grounding specialist/AIR_GROUNDING_SPECIALIST.json' \
            'profiles/grounding specialist/AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json' \
            'tests/AIR_GROUNDING_SET008_BEHAVIORAL_EVIDENCE_V1.json' \
            'tools/test_air_r7_mutations.py' \
            'tools/test_air_v073_release_seal_mutations.py' \
            'tools/validate_air_r7_remediation.py' \
            'tools/validate_air_v073_release_seal.py' | sort > /tmp/product-expected.txt
          git diff --name-only "$BASE" -- . ':!.github/workflows/grounding-set008-behavioral-carrier.yml' ':!.tmp-grounding-set008-behavioral-trigger' | sort > /tmp/product-actual.txt
          diff -u /tmp/product-expected.txt /tmp/product-actual.txt
          test "$(wc -l < /tmp/product-actual.txt)" -eq 10
          echo 'Grounding behavioral product scope: PASS (10/10; Executor unchanged)'

      - name: Run complete canonical AIR validation and mutation suite
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_air_suite.py | tee /tmp/full-suite.out
          grep -F 'AIR canonical validation suite: PASS' /tmp/full-suite.out
          grep -F 'AIR R7 remediation mutation suite: PASS (60/60 targeted mutants killed)' /tmp/full-suite.out
          grep -F 'AIR v0.7.3 release-seal mutation suite: PASS (47/47 targeted mutants killed)' /tmp/full-suite.out
          grep -F 'Implemented deterministic checks: 90/90' /tmp/full-suite.out
          grep -F 'Executed deterministic checks: 90/90' /tmp/full-suite.out

      - name: Remove helpers and enforce final scope including untracked files
        shell: bash
        run: |
          set -euo pipefail
          BASE=d79602ecba8b7092102afcd35f77a606b27548a6
          rm -f .github/workflows/grounding-set008-behavioral-carrier.yml .tmp-grounding-set008-behavioral-trigger
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --name-only "$BASE" | sort > /tmp/final-actual.txt
          diff -u /tmp/product-expected.txt /tmp/final-actual.txt
          test "$(wc -l < /tmp/final-actual.txt)" -eq 10
          git diff --quiet "$BASE" -- 'profiles/grounding specialist/AIR_GROUNDING_EXECUTOR.json'
          echo 'Final carrier scope + untracked hygiene: PASS (10/10; Executor unchanged)'

      - name: Commit and push validated product-only carrier
        shell: bash
        run: |
          set -euo pipefail
          BASE=d79602ecba8b7092102afcd35f77a606b27548a6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'specialists: promote Grounding after SET_008 behavioral revalidation'
          git diff --name-only "$BASE"..HEAD | sort > /tmp/postcommit-actual.txt
          diff -u /tmp/product-expected.txt /tmp/postcommit-actual.txt
          git diff --quiet "$BASE"..HEAD -- 'profiles/grounding specialist/AIR_GROUNDING_EXECUTOR.json'
          git push
          echo "CARRIER_HEAD=$(git rev-parse HEAD)"
          echo "CARRIER_TREE=$(git rev-parse HEAD^{tree})"
          sha256sum tests/AIR_GROUNDING_SET008_BEHAVIORAL_EVIDENCE_V1.json
          sha256sum 'profiles/grounding specialist/AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json'
          sha256sum catalog/AIR_SPECIALIST_PACKAGE_INDEX.json
