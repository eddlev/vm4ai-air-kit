name: AIR v0.7.1 set-005 one-run repair

on:
  push:
    branches:
      - repair/v0.7.1-set005-hardening

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved branch state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ff890fad5b2578978db0186c68312b61b9b87b41 HEAD
          test "$(cat VERSION)" = "0.7.0"
          test "$(find .air_tmp -maxdepth 1 -name 'repair.b64.part*' | wc -l)" = "6"

      - name: Reassemble and apply coordinated repair
        shell: bash
        run: |
          set -euo pipefail
          cat .air_tmp/repair.b64.part* | base64 -d | gzip -dc > /tmp/apply_air_v071_set005.py
          python3 -m py_compile /tmp/apply_air_v071_set005.py
          python3 /tmp/apply_air_v071_set005.py

      - name: Run deterministic release-contract validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_air_release.py

      - name: Commit repaired candidate to approved branch only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .air_tmp
          rm -f .github/workflows/apply-v071-set005.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare AIR Kit v0.7.1 set-005 hardening candidate"
          git push origin HEAD:repair/v0.7.1-set005-hardening
