name: AIR v0.7.1 set-005 one-run repair

on:
  push:
    branches:
      - repair/v0.7.1-set005-hardening

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved branch state and payload identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ff890fad5b2578978db0186c68312b61b9b87b41 HEAD
          test "$(cat VERSION)" = "0.7.0"
          test "$(find .air_tmp -maxdepth 1 -name 'repair.b64.part*' | wc -l)" = "7"
          test "$(git hash-object .air_tmp/repair.b64.part01)" = "8f9beaac26016edb588cf6df8ea6e9b247de405f"
          test "$(git hash-object .air_tmp/repair.b64.part02)" = "052c79ebdec55258e7f75966d683470c167d081f"
          test "$(git hash-object .air_tmp/repair.b64.part03)" = "4ac8710e4de8710e18b458e0da8990e246b91a93"
          test "$(git hash-object .air_tmp/repair.b64.part04)" = "acb27e1c14499f65d423a1ea1e4428df9e0df592"
          test "$(git hash-object .air_tmp/repair.b64.part05a)" = "24df9a5decab65afb7001a8429b94f5d329bc88f"
          test "$(git hash-object .air_tmp/repair.b64.part05b)" = "cc55a704b5af4e5d93a78894bec267b404a42fa8"
          test "$(git hash-object .air_tmp/repair.b64.part06)" = "9b8c451e945d42018b2037824e2d2c618f3a3b43"

      - name: Reassemble, repair generator, and apply coordinated repair
        shell: bash
        run: |
          set -euo pipefail
          cat .air_tmp/repair.b64.part* | base64 -d | gzip -dc > /tmp/apply_air_v071_set005.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_air_v071_set005.py')
          s = p.read_text()
          anchor = "    obj.setdefault('purpose', obj.get('description', 'Reusable governed method.'))\n"
          replacement = anchor + "    obj.setdefault('method_id', obj.get('SYSTEM_DESIGNATION', 'AIR_METHOD_UNSPECIFIED'))\n"
          if s.count(anchor) != 1:
              raise SystemExit('method_id generator hotfix anchor mismatch')
          s = s.replace(anchor, replacement, 1)
          eof_anchor = "        text = text.rstrip() + '\\n' + block + '\\n'\n"
          eof_replacement = "        text = text.rstrip() + '\\n' + block.strip() + '\\n'\n"
          if s.count(eof_anchor) != 1:
              raise SystemExit('Control EOF generator hotfix anchor mismatch')
          p.write_text(s.replace(eof_anchor, eof_replacement, 1))
          PY
          python3 -m py_compile /tmp/apply_air_v071_set005.py
          python3 /tmp/apply_air_v071_set005.py

      - name: Run deterministic release-contract validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_air_release.py

      - name: Commit repaired candidate to approved branch only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .air_tmp
          rm -f .github/workflows/apply-v071-set005.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare AIR Kit v0.7.1 set-005 hardening candidate"
          git push origin HEAD:repair/v0.7.1-set005-hardening
