name: AIR reproducibility contract patch runner

on:
  push:
    branches: [agent/test-reproducibility-contract]
    paths:
      - .github/workflows/air-repro-patch-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-reproducibility-contract
          fetch-depth: 0
      - name: Apply and validate focused contract patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/air_repro_patch.py
          export TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONHASHSEED=0 AIR_TEST_SEED=0
          export AIR_NETWORK_POLICY=LOCAL_PROTOTYPE_NOT_HERMETIC AIR_CONTAINER_IMAGE=GITHUB_PATCH_RUNNER AIR_SOURCE_COMMIT="$GITHUB_SHA"
          python3 tests/air_test_runner.py --manifest tests/air-test-manifest.json --output /tmp/run-1.json --run-index 1
          python3 tests/air_test_runner.py --manifest tests/air-test-manifest.json --output /tmp/run-2.json --run-index 2
          python3 tests/air_test_runner.py --manifest tests/air-test-manifest.json --output /tmp/run-3.json --run-index 3
          python3 - <<'PY'
          import json
          runs=[json.load(open(f'/tmp/run-{i}.json')) for i in (1,2,3)]
          assert all(r['decision']=='PASS' for r in runs)
          assert len({r['decision_fingerprint'] for r in runs}) == 1
          print('focused pre-PR checks: 3/3 decision fingerprints identical')
          PY
      - name: Commit focused Group 1 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AIR repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/air_repro_patch.py .github/workflows/air-repro-patch-run.yml
          git add prompts/AIR_CORE_RUNTIME.md prompts/AIR_CONTROL_SURFACE.md prompts/AIR_DEFAULT_STARTER_PROFILE.json prompts/AIR_HANDOFF_CARD_TEMPLATE.json tests .github/workflows/air-reproducibility.yml
          git commit -m "Add deterministic test reproducibility contract"
          git push origin HEAD:agent/test-reproducibility-contract
