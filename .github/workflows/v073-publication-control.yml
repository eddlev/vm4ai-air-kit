name: AIR v0.7.3 publication control

on:
  push:
    branches:
      - release/v0.7.3-publish-control
    paths:
      - '.tmp-v073-publication-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SEALED_SHA: a3e63b0ea416112907e271cbdfa028180c672807
      SEALED_TREE: d412e8637473b91b0c550af0f53608ae319a2b70
      TAG: v0.7.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify sealed source and disposable-control scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$SEALED_SHA"
          test "$(git rev-parse "$SEALED_SHA^{tree}")" = "$SEALED_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "0.7.3"
          printf '%s\n' \
            '.github/workflows/v073-publication-control.yml' \
            '.tmp-v073-publication-trigger' | sort > /tmp/expected-control.txt
          git diff --name-only "$SEALED_SHA"..HEAD | sort > /tmp/actual-control.txt
          diff -u /tmp/expected-control.txt /tmp/actual-control.txt
          echo 'Sealed source + disposable publication scope: PASS'

      - name: Revalidate exact sealed commit
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/air-v073-sealed "$SEALED_SHA"
          cd /tmp/air-v073-sealed
          python3 tools/validate_air_suite.py | tee /tmp/v073-publication-validation.out
          grep -F 'AIR canonical validation suite: PASS' /tmp/v073-publication-validation.out
          grep -F 'AIR v0.7.3 release-seal validation: PASS' /tmp/v073-publication-validation.out
          grep -F 'AIR R7 remediation mutation suite: PASS (62/62 targeted mutants killed)' /tmp/v073-publication-validation.out
          grep -F 'AIR v0.7.3 release-seal mutation suite: PASS (51/51 targeted mutants killed)' /tmp/v073-publication-validation.out
          grep -F 'Implemented deterministic checks: 90/90' /tmp/v073-publication-validation.out
          grep -F 'Executed deterministic checks: 90/90' /tmp/v073-publication-validation.out
          echo 'Sealed commit revalidation: PASS'

      - name: Create or verify exact v0.7.3 tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [ -n "$remote_tag" ]; then
            test "$remote_tag" = "$SEALED_SHA"
            echo "Existing $TAG tag already resolves exactly to sealed commit"
          else
            git tag "$TAG" "$SEALED_SHA"
            git push origin "refs/tags/$TAG"
            echo "Created lightweight $TAG at $SEALED_SHA"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; verifying exact publication state"
          else
            cat > /tmp/release-notes.md <<'EOF'
          ## What's Changed

          AIR Kit v0.7.3 completes the Foundation 2.6.3 / Object Contract SET_008 hardening cycle and closes the five-package Specialist revalidation track.

          Release identities:
          - AIR Kit: `0.7.3`
          - AIR Foundation: `2.6.3` / `AIR_FOUNDATION_2_6_3_OBJECT_CONTRACT_SET_008`
          - Handoff schema: `2.3.0`, template revision 19 with independent `user_revision`
          - Runtime Route Map: `1.2.2`
          - Specialist Package Index: `1.3.13`
          - Specialist packages: all five SET_008 static-valid and replayable behavioral-pass; draft Executor components remain explicitly unvalidated where applicable

          Release validation includes the canonical AIR suite, deterministic contract registry `90/90`, R7 targeted mutations `62/62`, and v0.7.3 release-seal mutations `51/51`.

          Behavioral evidence is replayable observable-output evidence on its recorded model host. This release does not claim cross-host equivalence, hidden reasoning access, or backend AIR enforcement.

          **Full Changelog**: https://github.com/eddlev/vm4ai-air-kit/compare/v0.7.2...v0.7.3
          EOF
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'AIR Kit v0.7.3' \
              --target "$SEALED_SHA" \
              --notes-file /tmp/release-notes.md
          fi

          tag_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$tag_sha" = "$SEALED_SHA"
          release_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.tag_name')"
          release_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish')"
          release_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.draft')"
          release_prerelease="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.prerelease')"
          test "$release_tag" = "$TAG"
          test "$release_target" = "$SEALED_SHA"
          test "$release_draft" = "false"
          test "$release_prerelease" = "false"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$SEALED_SHA"
          test "$(git rev-parse "$SEALED_SHA^{tree}")" = "$SEALED_TREE"
          echo "PUBLICATION_TAG_SHA=$tag_sha"
          echo "PUBLICATION_RELEASE_TARGET=$release_target"
          echo 'v0.7.3 publication + post-effect closure: PASS'
