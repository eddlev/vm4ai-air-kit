name: Apply AIR v0.7.1 release seal

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-release-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply v0.7.1 release-seal transition
        run: python3 tools/apply_v071_release_seal.py .

      - name: Reseal operational dependency graph
        run: python3 tools/reseal_air_candidate.py --apply

      - name: Validate complete sealed release tree
        run: python3 tools/validate_air_suite.py

      - name: Verify no further reseal changes remain
        run: python3 tools/reseal_air_candidate.py --check

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit sealed release state
        run: |
          if git diff --quiet; then
            echo "No v0.7.1 release-seal changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Seal AIR Kit v0.7.1 release catalog [v071-sealed]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# PR synchronize trigger for the release-seal gate.
