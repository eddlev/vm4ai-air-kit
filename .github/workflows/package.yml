name: Package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package tooling
        run: python -m pip install --upgrade pip && python -m pip install ".[test]" pipx
      - name: Lint Python sources
        run: python -m ruff check src tests hatch_build.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Run isolated wheel installation tests
        env:
          AIR_TEST_WHEEL: ${{ github.workspace }}/dist/vm4ai_air-0.4.0.dev0-py3-none-any.whl
          AIR_TEST_SDIST: ${{ github.workspace }}/dist/vm4ai_air-0.4.0.dev0.tar.gz
        run: python -m pytest -m package
      - name: Smoke-test pipx installation
        run: |
          pipx install dist/vm4ai_air-0.4.0.dev0-py3-none-any.whl
          air --version
          air --json doctor
          pipx uninstall vm4ai-air
      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm4ai-air-distributions
          path: dist/*
          if-no-files-found: error
