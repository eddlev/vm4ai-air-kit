name: AIR S14 one-shot remediation

on:
  push:
    branches: [air250-preview-stage-t12d]
    paths:
      - tools/air_s14_remediate_once.py
      - .github/workflows/air-s14-remediation-once.yml

permissions:
  contents: write

concurrency:
  group: air-s14-remediation-once
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event.head_commit.message == 'Stage AIR 2.5.0 S14 remediation runner'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air250-preview-stage-t12d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply, reseal, and validate S14
        run: python tools/air_s14_remediate_once.py
      - name: Commit validated remediation and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIR remediation'
          git config user.email 'air-remediation@users.noreply.github.com'
          git rm tools/air_s14_remediate_once.py .github/workflows/air-s14-remediation-once.yml
          git add -A
          git commit -m 'Close AIR 2.5.0 artifact field contract and reseal dependencies'
          git push origin HEAD:air250-preview-stage-t12d
