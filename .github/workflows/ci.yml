name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Lint Python sources
        run: python -m ruff check src tests hatch_build.py
      - name: Run source and integration tests
        env:
          AIR_HOME: ${{ runner.temp }}/air-home
          AIR_RESOURCE_ROOT: ${{ github.workspace }}
        run: python -m pytest -m "not package"
