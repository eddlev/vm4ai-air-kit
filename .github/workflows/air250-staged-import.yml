name: AIR 2.5.0 staged import

on:
  push:
    branches: [air250-preview-align]
    paths:
      - '.air-sync6/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air250-preview-align
          fetch-depth: 0
      - name: Reconstruct validated overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f .air-sync6/READY
          test "$(find .air-sync6 -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 45
          cat .air-sync6/chunk-* > /tmp/air-overlay.b64
          echo '820af4aff4658e3894afa55fdfcdf8d3c976e173c00ca4327ce2ca79b52efbc5  /tmp/air-overlay.b64' | sha256sum -c -
          base64 -d /tmp/air-overlay.b64 > /tmp/air-overlay.tar.gz
          echo 'dad935a97848cbb2f290879b91a762f10c97886ad7cc25975d1ef71c4e1deafb  /tmp/air-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/air-overlay.tar.gz -C .
          echo '6281cdaa693c3fcbfcc3c0216114ef9de6d03c2791b13b06d8665fc3d603c877  prompts/AIR_CORE_RUNTIME.md' | sha256sum -c -
          echo '298c3dac6276e73f7527f6e7f856a0e11465da2955b953607f4e7c4b9b994713  prompts/AIR_CONTROL_SURFACE.md' | sha256sum -c -
          echo '918fdfaeda29a64a49e9b26c358e1b60640e94a43d81a764cc77b24b682683cd  prompts/AIR_HANDOFF_CARD_TEMPLATE.json' | sha256sum -c -
          echo 'ceba1d4cdbcafe2506794d2e0fcdaa05e57b94314ccc2e7147f4305e1153ece0  catalog/AIR_SPECIALIST_PACKAGE_INDEX.json' | sha256sum -c -
          python tools/validate_specialist_layer.py
          python tools/validate_air250_full_static.py
      - name: Commit reconstructed preview tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .air-sync .air-sync4 .air-sync5 .air-sync6
          rm -f .github/workflows/air250-staged-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align public AIR kit to 2.5.0-preview.1'
          git push origin HEAD:air250-preview-align
