name: AIR final preview validation once

on:
  push:
    branches: [air250-preview-stage-t12d]
    paths:
      - .github/workflows/air-final-preview-validation-once.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: air-final-preview-validation-once
  cancel-in-progress: false

jobs:
  validate-final-tree:
    if: github.event.head_commit.message == 'Stage final AIR 2.5.0 hosted validation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air250-preview-stage-t12d
          fetch-depth: 0

      - name: Remove one-shot workflow from tree under test
        shell: bash
        run: git rm .github/workflows/air-final-preview-validation-once.yml

      - name: Validate formal object closure
        run: python tests/air_object_contract_check.py

      - name: Run three isolated executable checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .air-test-evidence
          docker pull python:3.12.11-slim
          IMAGE_REF="$(docker image inspect python:3.12.11-slim --format '{{index .RepoDigests 0}}')"
          printf '%s\n' "$IMAGE_REF" > .air-test-evidence/container-image.txt
          for i in 1 2 3; do
            docker run --rm --network none \
              -e TZ=UTC \
              -e LANG=C.UTF-8 \
              -e LC_ALL=C.UTF-8 \
              -e PYTHONHASHSEED=0 \
              -e AIR_TEST_SEED=0 \
              -e AIR_NETWORK_POLICY=DISABLED_ENFORCED_DOCKER \
              -e AIR_CONTAINER_IMAGE="$IMAGE_REF" \
              -e AIR_SOURCE_COMMIT=FINAL_TREE_UNCOMMITTED_SHA_PENDING \
              -v "$PWD:/repo:ro" \
              -v "$PWD/.air-test-evidence:/evidence" \
              -w /repo \
              "$IMAGE_REF" \
              python tests/air_test_runner.py \
                --manifest tests/air-test-manifest.json \
                --output "/evidence/run-$i.json" \
                --run-index "$i"
          done
          docker run --rm --network none \
            -e TZ=UTC \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -e PYTHONHASHSEED=0 \
            -v "$PWD:/repo:ro" \
            -v "$PWD/.air-test-evidence:/evidence" \
            -w /repo \
            "$IMAGE_REF" \
            python tests/air_test_compare.py \
              --runs /evidence/run-1.json /evidence/run-2.json /evidence/run-3.json \
              --output /evidence/determinism-report.json \
              --required-identical-runs 3

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release_bundle.py
          python - <<'PY'
          import zipfile
          required = {
              'AIR_CORE_RUNTIME.md', 'AIR_CONTROL_SURFACE.md', 'AIR_GOV.md',
              'AIR_DEFAULT_STARTER_PROFILE.json', 'AIR_HANDOFF_CARD_TEMPLATE.json',
              'START_HERE.md', 'RELEASE_CHANNEL_POLICY.md',
              'VALIDATION_EVIDENCE_0.6.0-preview.1.md', 'BUG_REPORTING.md',
              'COMPATIBILITY.md', 'LICENSE', 'NOTICE', 'AIR_CORE_MANIFEST.json',
          }
          with zipfile.ZipFile('dist/AIR-core.zip') as z:
              names = set(z.namelist())
          if names != required:
              raise SystemExit(f'bundle contents mismatch: {sorted(names)}')
          print('AIR-core.zip final contents PASS')
          PY

      - name: Commit exact validated tree and publish statuses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'AIR validation'
          git config user.email 'air-validation@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize AIR 2.5.0 hosted preview validation'
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:air250-preview-stage-t12d
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -f state=success \
            -f context='AIR final preview / reproducibility' \
            -f description='Final tree: isolated executable checks passed across 3 identical runs'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -f state=success \
            -f context='AIR final preview / release assets' \
            -f description='Final tree: deterministic AIR release bundle and required contents passed'
          printf '%s\n' "$FINAL_SHA" > .air-test-evidence/final-validated-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: air-final-preview-validation-${{ github.sha }}
          path: |
            .air-test-evidence/
            dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
