name: Grounding SET008 static carrier

on:
  push:
    branches: [grounding-set008-static-carrier-v1]

permissions:
  contents: write

jobs:
  build-grounding-static-carrier:
    if: ${{ contains(github.event.head_commit.message, '[grounding-static-run]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact authorized base and helper-only bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BASE=b411067fe0c13a45d5e039dfee32a24bcaf314f6
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"..HEAD | sort > /tmp/bootstrap.txt
          printf '%s\n' '.github/workflows/grounding-set008-static-carrier.yml' '.tmp-grounding-set008-static-trigger' | sort > /tmp/expected-bootstrap.txt
          diff -u /tmp/expected-bootstrap.txt /tmp/bootstrap.txt

      - name: Recover and execute previously exercised Grounding transformation
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=895724c1761b11f0ec7fb4570c55bf1016e08beb
          git show "$SOURCE:.github/workflows/grounding-set008-static-carrier.yml" > /tmp/carrier-v1.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('/tmp/carrier-v1.yml').read_text()
          pos=s.index("      - name: Apply Grounding SET008 static compatibility transition\n")
          start=s.index("          python3 - <<'PY'\n",pos)+len("          python3 - <<'PY'\n")
          end=s.index("\n          PY\n",start)
          Path('/tmp/apply_grounding_set008.py').write_text(textwrap.dedent(s[start:end])+'\n')
          PY
          python3 /tmp/apply_grounding_set008.py

      - name: Reseal dependency graph then prune outward propagation to approved scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=b411067fe0c13a45d5e039dfee32a24bcaf314f6
          python3 tools/reseal_air_candidate.py --apply
          git diff --name-only "$BASE" -- prompts catalog profiles | while IFS= read -r path; do
            case "$path" in
              "catalog/AIR_SPECIALIST_PACKAGE_INDEX.json"|\
              "profiles/grounding specialist/AIR_GROUNDING_DOMAIN_PACKAGE.json"|\
              "profiles/grounding specialist/AIR_GROUNDING_EXECUTOR.json"|\
              "profiles/grounding specialist/AIR_GROUNDING_METHOD_PACK.json"|\
              "profiles/grounding specialist/AIR_GROUNDING_SPECIALIST.json"|\
              "profiles/grounding specialist/AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json") ;;
              *) git checkout "$BASE" -- "$path" ;;
            esac
          done

      - name: Reconcile final manifest mirrors and all Index manifest receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.')
          g=root/'profiles/grounding specialist'
          mp=g/'AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json'
          ip=root/'catalog/AIR_SPECIALIST_PACKAGE_INDEX.json'
          def meta(p):
            raw=p.read_bytes(); return hashlib.sha256(raw).hexdigest(),len(raw),len(raw.decode().splitlines())
          m=json.loads(mp.read_text())
          for c in m['components']:
            p=g/c['filename']; o=json.loads(p.read_text()); status=str(o.get('STATUS') or o.get('status') or '')
            h,n,l=meta(p); c.update({'status':status,'sha256':h,'size_bytes':n,'line_count':l})
            c['availability_state']='AVAILABLE_UNVALIDATED' if status=='DRAFT' or 'STATIC_CONTRACT_VALIDATION_PENDING' in status else 'VALIDATED_AVAILABLE_UNBOUND'
          mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          idx=json.loads(ip.read_text())
          for e in idx['entries']:
            targets=list(root.glob('profiles/**/'+e['manifest_filename']))
            if len(targets)!=1: raise SystemExit('manifest target ambiguity '+e['manifest_filename'])
            e['manifest_sha256']=meta(targets[0])[0]
          ip.write_text(json.dumps(idx,indent=2,ensure_ascii=False)+'\n')
          print('Grounding manifest sha256',meta(mp)[0])
          PY

      - name: Seal current Specialist Index hash into v0.7.3 validator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          idx=Path('catalog/AIR_SPECIALIST_PACKAGE_INDEX.json'); h=hashlib.sha256(idx.read_bytes()).hexdigest()
          p=Path('tools/validate_air_v073_release_seal.py'); s=p.read_text()
          if '__GROUNDING_INDEX_SHA__' not in s: raise SystemExit('index hash placeholder missing')
          p.write_text(s.replace('__GROUNDING_INDEX_SHA__',h,1)); print('Grounding candidate index sha256',h)
          PY

      - name: Verify exact product scope before validation
        shell: bash
        run: |
          set -euo pipefail
          BASE=b411067fe0c13a45d5e039dfee32a24bcaf314f6
          cat > /tmp/expected-product.txt <<'EOF'
          catalog/AIR_SPECIALIST_PACKAGE_INDEX.json
          profiles/grounding specialist/AIR_GROUNDING_DOMAIN_PACKAGE.json
          profiles/grounding specialist/AIR_GROUNDING_EXECUTOR.json
          profiles/grounding specialist/AIR_GROUNDING_METHOD_PACK.json
          profiles/grounding specialist/AIR_GROUNDING_SPECIALIST.json
          profiles/grounding specialist/AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json
          tools/test_air_r7_mutations.py
          tools/test_air_v073_release_seal_mutations.py
          tools/validate_air_r7_remediation.py
          tools/validate_air_v073_release_seal.py
          EOF
          sed -i 's/^          //' /tmp/expected-product.txt
          sort -o /tmp/expected-product.txt /tmp/expected-product.txt
          git diff --name-only "$BASE" -- catalog profiles tools | sort > /tmp/actual-product.txt
          diff -u /tmp/expected-product.txt /tmp/actual-product.txt
          test "$(wc -l < /tmp/actual-product.txt)" -eq 10
          echo 'Grounding product scope: PASS (10/10)'

      - name: Validate Grounding SET008 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_air_r7_remediation.py tools/test_air_r7_mutations.py tools/validate_air_v073_release_seal.py tools/test_air_v073_release_seal_mutations.py
          python3 tools/validate_air_suite.py --without-mutations
          python3 tools/test_air_r7_mutations.py
          python3 tools/test_air_v073_release_seal_mutations.py
          python3 tools/validate_air_suite.py
          echo 'Grounding SET008 candidate validation: PASS'

      - name: Remove carrier helpers and verify final net scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/grounding-set008-static-carrier.yml .tmp-grounding-set008-static-trigger
          BASE=b411067fe0c13a45d5e039dfee32a24bcaf314f6
          git diff --name-only "$BASE" | sort > /tmp/final-net.txt
          diff -u /tmp/expected-product.txt /tmp/final-net.txt
          test "$(wc -l < /tmp/final-net.txt)" -eq 10
          echo 'Grounding final net scope: PASS (10 permanent paths; helpers absent)'

      - name: Commit validated permanent carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "specialists: revalidate Grounding for SET_008 [grounding-static-applied]"
          git push
