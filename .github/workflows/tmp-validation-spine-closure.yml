name: Temporary validation spine closure

on:
  push:
    branches:
      - repair/v0.7.1-set005-hardening
    paths:
      - .github/workflows/tmp-validation-spine-closure.yml

permissions:
  contents: write

jobs:
  close-validation-spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v0.7.1-set005-hardening
          fetch-depth: 0

      - name: Normalize staged validator anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/validate_air_release.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace("    require((ROOT / 'tools' / 'validate_air_boot.py').is_file(), 'missing independent routine-boot validator')\n", '')
          text = text.replace("    require((ROOT / 'tools' / 'test_air_validator_mutations.py').is_file(), 'missing validator mutation suite')\n", '')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Write permanent validation spine
        run: python3 tools/_tmp_apply_validation_spine_fix.py

      - name: Normalize resealer observed hash alias
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/reseal_air_candidate.py')
          text = p.read_text(encoding='utf-8')
          old = "                if field == 'manifest_sha256':\n                    new = m['sha256']\n                else:\n                    new = m[field]"
          new = "                if field in {'manifest_sha256', 'observed_sha256'}:\n                    new = m['sha256']\n                else:\n                    new = m[field]"
          if old not in text:
              raise SystemExit('resealer hash alias anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Tighten stale sibling mutation isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/test_air_validator_mutations.py')
          text = p.read_text(encoding='utf-8')
          old = '''def stale_sibling_sha(t: Path) -> None:\n    p = t / 'profiles' / 'capability ecology architect' / 'AIR_CAPABILITY_ECOLOGY_ARCHITECT.json'\n    o = json.loads(p.read_text(encoding='utf-8'))\n    o['external_dependency_state']['domain_capability_registry']['sha256'] = '0' * 64\n    p.write_text(json.dumps(o, indent=2) + '\\n', encoding='utf-8')\n'''
          new = '''def stale_sibling_sha(t: Path) -> None:\n    import hashlib\n    profile = t / 'profiles' / 'capability ecology architect' / 'AIR_CAPABILITY_ECOLOGY_ARCHITECT.json'\n    o = json.loads(profile.read_text(encoding='utf-8'))\n    o['external_dependency_state']['domain_capability_registry']['sha256'] = '0' * 64\n    profile.write_text(json.dumps(o, indent=2) + '\\n', encoding='utf-8')\n    praw = profile.read_bytes()\n\n    manifest = t / 'profiles' / 'capability ecology architect' / 'AIR_CAPABILITY_ECOLOGY_ARCHITECT_PACKAGE_MANIFEST.json'\n    mo = json.loads(manifest.read_text(encoding='utf-8'))\n    component = next(c for c in mo['components'] if c['filename'] == profile.name)\n    component['sha256'] = hashlib.sha256(praw).hexdigest()\n    component['size_bytes'] = len(praw)\n    component['line_count'] = len(praw.decode('utf-8').splitlines())\n    manifest.write_text(json.dumps(mo, indent=2) + '\\n', encoding='utf-8')\n    mraw = manifest.read_bytes()\n\n    index = t / 'catalog' / 'AIR_SPECIALIST_PACKAGE_INDEX.json'\n    io = json.loads(index.read_text(encoding='utf-8'))\n    entry = next(e for e in io['entries'] if e['manifest_filename'] == manifest.name)\n    entry['manifest_sha256'] = hashlib.sha256(mraw).hexdigest()\n    index.write_text(json.dumps(io, indent=2) + '\\n', encoding='utf-8')\n'''
          if old not in text:
              raise SystemExit('stale sibling mutation anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Dependency graph reseal
        run: python3 tools/reseal_air_candidate.py --apply

      - name: Validate source tree through canonical suite
        run: |
          python3 tools/validate_air_suite.py > /tmp/source-suite.txt 2>&1 || { cat /tmp/source-suite.txt; exit 1; }
          cat /tmp/source-suite.txt

      - name: Commit bounded closure
        run: |
          rm tools/_tmp_apply_validation_spine_fix.py
          git config user.name "AIR repair automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(set005): close validation spine and dependency reseal"
          git push origin HEAD:repair/v0.7.1-set005-hardening

      - name: Validate exact committed tree
        run: |
          python3 tools/validate_air_suite.py > /tmp/commit-suite.txt 2>&1 || { cat /tmp/commit-suite.txt; exit 1; }
          cat /tmp/commit-suite.txt

      - name: Build and validate extracted consumer tree
        run: |
          mkdir -p /tmp/archive /tmp/consumer
          git archive --format=zip --output=/tmp/archive/candidate-precleanup.zip HEAD -- . ':(exclude).github/workflows/tmp-validation-spine-closure.yml'
          unzip -q /tmp/archive/candidate-precleanup.zip -d /tmp/consumer
          cd /tmp/consumer
          python3 tools/validate_air_suite.py > /tmp/package-suite.txt 2>&1 || { cat /tmp/package-suite.txt; exit 1; }
          cat /tmp/package-suite.txt
          unzip -t /tmp/archive/candidate-precleanup.zip > /tmp/zip-integrity.txt
          sha256sum /tmp/archive/candidate-precleanup.zip > /tmp/archive-sha256.txt

      - name: Assemble closure evidence
        run: |
          mkdir -p /tmp/evidence
          cp /tmp/source-suite.txt /tmp/evidence/
          cp /tmp/commit-suite.txt /tmp/evidence/
          cp /tmp/package-suite.txt /tmp/evidence/
          cp /tmp/zip-integrity.txt /tmp/evidence/
          cp /tmp/archive-sha256.txt /tmp/evidence/
          git rev-parse HEAD > /tmp/evidence/correction-commit.txt
          git status --porcelain > /tmp/evidence/git-status.txt

      - uses: actions/upload-artifact@v4
        with:
          name: validation-spine-closure-evidence
          path: /tmp/evidence
