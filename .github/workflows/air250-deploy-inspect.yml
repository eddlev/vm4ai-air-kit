name: AIR 2.5.0 staged payload inspection

on:
  push:
    branches: [air250-preview-deploy]
    paths:
      - .air-deploy/READY

permissions:
  contents: write

jobs:
  inspect-payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air250-preview-deploy

      - name: Diagnose staged chunks
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'AIR 2.5.0 staged deployment chunk diagnostics'
            for f in $(find .air-deploy -maxdepth 1 -type f -name 'chunk-*' | sort); do
              clean="$(tr -d '\r\n' < "$f")"
              printf '%s bytes=%s clean_chars=%s mod4=%s invalid=' "$f" "$(stat -c%s "$f")" "${#clean}" "$(( ${#clean} % 4 ))"
              printf '%s' "$clean" | LC_ALL=C grep -o '[^A-Za-z0-9+/=]' | sort | uniq -c | tr '\n' ';' || true
              echo
            done
            cat $(find .air-deploy -maxdepth 1 -type f -name 'chunk-*' | sort) | tr -d '\r\n' > /tmp/payload.b64
            echo "combined_chars=$(wc -c < /tmp/payload.b64)"
            echo "combined_mod4=$(( $(wc -c < /tmp/payload.b64) % 4 ))"
            if base64 -d /tmp/payload.b64 > /tmp/payload.bin 2>/tmp/base64.err; then
              echo 'base64_decode=PASS'
              echo "decoded_bytes=$(stat -c%s /tmp/payload.bin)"
              echo "decoded_sha256=$(sha256sum /tmp/payload.bin | awk '{print $1}')"
              if xz -t /tmp/payload.bin 2>/tmp/xz.err; then
                echo 'xz_test=PASS'
              else
                echo 'xz_test=FAIL'
                cat /tmp/xz.err
              fi
            else
              echo 'base64_decode=FAIL'
              cat /tmp/base64.err
            fi
          } > .air-deploy/INSPECTION_REPORT.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIR Deployment Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .air-deploy/INSPECTION_REPORT.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Diagnose staged AIR 2.5.0 deployment payload'
          git push origin HEAD:air250-preview-deploy
