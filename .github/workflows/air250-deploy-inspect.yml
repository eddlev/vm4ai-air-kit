name: AIR 2.5.0 staged payload inspection

on:
  push:
    branches: [air250-preview-deploy]
    paths:
      - .air-deploy/READY

permissions:
  contents: write

jobs:
  inspect-payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air250-preview-deploy

      - name: Recover and inspect staged payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, tarfile

          files = sorted(Path('.air-deploy').glob('chunk-*'))
          chunks = [p.read_text().replace('\r','').replace('\n','') for p in files]
          chunks[7] = chunks[7].replace('.', '')

          def decode(text):
              return base64.b64decode(text, validate=True)

          def stream_prefix_ok(text: str) -> bool:
              try:
                  d = lzma.LZMADecompressor()
                  d.decompress(decode(text))
                  return True
              except Exception:
                  return False

          # A valid chunk-4 repair must remain decodable through known-clean chunks 5 and 6.
          before4 = ''.join(chunks[:4])
          after4 = chunks[5] + chunks[6]
          c4 = chunks[4]
          candidates4=[]
          for i in range(len(c4)):
              repaired = c4[:i] + c4[i+1:]
              if stream_prefix_ok(before4 + repaired + after4):
                  candidates4.append((i,c4[i],repaired))
          if len(candidates4) != 1:
              raise SystemExit(f'chunk4 extended recovery ambiguous count={len(candidates4)} candidates={[(i,c) for i,c,_ in candidates4[:50]]}')
          i4,ch4,chunks[4]=candidates4[0]

          # A valid chunk-7 repair must make the COMPLETE stream decompress successfully.
          prefix7=''.join(chunks[:7])
          c7=chunks[7]
          suffix8=chunks[8]
          candidates7=[]
          for i in range(len(c7)):
              repaired=c7[:i]+c7[i+1:]
              text=prefix7+repaired+suffix8
              try:
                  raw=decode(text)
                  data=lzma.decompress(raw)
                  candidates7.append((i,c7[i],repaired,raw,data))
              except Exception:
                  pass
          if len(candidates7) != 1:
              raise SystemExit(f'chunk7 full recovery ambiguous count={len(candidates7)} candidates={[(i,c) for i,c,_,_,_ in candidates7[:50]]}')
          i7,ch7,chunks[7],raw,data=candidates7[0]

          out=Path('/tmp/air250-payload.tar')
          out.write_bytes(data)
          report=[]
          report.append('AIR 2.5.0 staged deployment recovery + inspection')
          report.append(f'chunk4_deleted_index={i4} char={ch4!r}')
          report.append('chunk7_removed_literal_dot=true')
          report.append(f'chunk7_deleted_index={i7} char={ch7!r}')
          report.append(f'xz_stream_sha256={hashlib.sha256(raw).hexdigest()}')
          report.append(f'tar_bytes={len(data)}')
          report.append('--- FILES ---')
          with tarfile.open(out,'r:') as tf:
              names=sorted(m.name for m in tf.getmembers() if m.isfile())
              report.extend(names)
              report.append('--- SELECTED SHA256 ---')
              for name in names:
                  if any(k in name for k in ['AIR_CORE_RUNTIME.md','AIR_HANDOFF_CARD_TEMPLATE.json','AIR_RUNTIME_ROUTE_MAP','AIR_SPECIALIST_PACKAGE_INDEX','VERSION','README.md','air-test-manifest.json']):
                      f=tf.extractfile(name)
                      if f:
                          report.append(f'{hashlib.sha256(f.read()).hexdigest()}  {name}')
          Path('.air-deploy/INSPECTION_REPORT.txt').write_text('\n'.join(report)+'\n')
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIR Deployment Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .air-deploy/INSPECTION_REPORT.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Recover and inspect staged AIR 2.5.0 deployment payload'
          git push origin HEAD:air250-preview-deploy
