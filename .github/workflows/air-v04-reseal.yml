name: AIR v0.4 branch reseal

on:
  push:
    branches:
      - agent/air-v0.4-alignment
    paths:
      - .github/workflows/air-v04-reseal.yml

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/air-v0.4-alignment
          fetch-depth: 0

      - name: Patch and reseal AIR kit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import copy, hashlib, json, re

          ROOT = Path('.')
          PROMPTS = ROOT / 'prompts'
          FLOORS = [f'AIR-FLOOR-{i:03d}' for i in range(13, 21)]

          def load_json(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def write_json(path, data):
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def identity(path, version=None, designation=None, cls=None):
              b = path.read_bytes()
              out = {
                  'filename': path.name,
                  'sha256': hashlib.sha256(b).hexdigest(),
                  'size_bytes': len(b),
                  'line_count': len(path.read_text(encoding='utf-8').splitlines()),
              }
              if designation is not None: out['designation'] = designation
              if version is not None: out['version'] = version
              if cls is not None: out['class'] = cls
              return out

          # 1) Repair serialized handoff governance defaults without changing schema shape.
          hp = PROMPTS / 'AIR_HANDOFF_CARD_TEMPLATE.json'
          hd = load_json(hp)
          card = hd['AIR_HANDOFF_CARD']
          card['card_revision'] = max(int(card.get('card_revision', 0)), 6)
          gs = card['governance_state']
          gs['governance_supplement_version'] = '2.2.0'
          gs['governance_floor_version'] = '2.1.0'
          gs['floor_invariant_reference']['registry_version'] = '2.1.0'
          write_json(hp, hd)

          # 2) Establish exact current foundation identities after the handoff repair.
          core = identity(PROMPTS/'AIR_CORE_RUNTIME.md', '2.4.0', 'AIR_CORE_RUNTIME_V2', 'FOUNDATION_PROMPT')
          control = identity(PROMPTS/'AIR_CONTROL_SURFACE.md', '2.4.0', 'AIR_CONTROL_SURFACE_V2', 'FOUNDATION_PROMPT')
          gov = identity(PROMPTS/'AIR_GOV.md', '2.2.0', 'AIR_HR_GOVERNANCE_SUPPLEMENT_V2', 'FOUNDATION_PROMPT')
          starter = identity(PROMPTS/'AIR_DEFAULT_STARTER_PROFILE.json', '2.4.0', 'AIR_DEFAULT_STARTER_V2', 'TASK_COMPOSITE')
          handoff = identity(hp, '2.2.0', 'AIR_HANDOFF_CARD_TEMPLATE_V2', 'TEMPLATE')
          FOUNDATION = {x['filename']: x for x in [core, control, gov, starter, handoff]}

          def patch_foundation(node):
              if isinstance(node, dict):
                  rf = node.get('required_files')
                  if isinstance(rf, list):
                      for i, item in enumerate(rf):
                          if isinstance(item, dict) and item.get('filename') in FOUNDATION:
                              keep = dict(item)
                              keep.update(FOUNDATION[item['filename']])
                              rf[i] = keep
                  for k, v in list(node.items()):
                      if k in ('required_floor_invariants',) and isinstance(v, list) and any(str(x).startswith('AIR-FLOOR-') for x in v):
                          node[k] = FLOORS.copy()
                      elif k == 'foundation_versions' and isinstance(v, dict):
                          v.update({'core':'2.4.0','control':'2.4.0','governance':'2.2.0','starter':'2.4.0','handoff_schema':'2.2.0'})
                      else:
                          patch_foundation(v)
              elif isinstance(node, list):
                  for x in node: patch_foundation(x)

          def patch_dependency_identities(node, known):
              if isinstance(node, dict):
                  fn = node.get('filename')
                  if fn in known:
                      ident = known[fn]
                      if 'sha256' in node: node['sha256'] = ident['sha256']
                      if 'size_bytes' in node: node['size_bytes'] = ident['size_bytes']
                      if 'line_count' in node: node['line_count'] = ident['line_count']
                      if 'version' in node and ident.get('version'): node['version'] = ident['version']
                  for v in node.values(): patch_dependency_identities(v, known)
              elif isinstance(node, list):
                  for x in node: patch_dependency_identities(x, known)

          packages = [
              {
                  'dir': ROOT/'profiles'/'grounding specialist',
                  'files': ['AIR_GROUNDING_DOMAIN_PACKAGE.json','AIR_GROUNDING_METHOD_PACK.json','AIR_GROUNDING_SPECIALIST.json','AIR_GROUNDING_EXECUTOR.json'],
                  'manifest': 'AIR_GROUNDING_SPECIALIST_PACKAGE_MANIFEST.json'
              },
              {
                  'dir': ROOT/'profiles'/'governance specialist',
                  'files': ['AIR_AI_GOVERNANCE_DOMAIN_PACKAGE.json','AIR_AI_GOVERNANCE_AGENTIC_OVERLAY.json','AIR_AI_GOVERNANCE_SPECIALIST.json','AIR_AI_GOVERNANCE_METHOD_PACK.json','AIR_AI_GOVERNANCE_EXECUTOR.json'],
                  'manifest': 'AIR_AI_GOVERNANCE_SPECIALIST_PACKAGE_MANIFEST.json'
              },
              {
                  'dir': ROOT/'profiles'/'capability ecology architect',
                  'files': ['AIR_DOMAIN_CAPABILITY_REGISTRY.json','AIR_HUMAN_TO_MACHINE_CAPABILITY_TRANSLATOR.json','AIR_CAPABILITY_ECOLOGY_ARCHITECT.json','AIR_CAPABILITY_ECOLOGY_METHOD_PACK.json'],
                  'manifest': 'AIR_CAPABILITY_ECOLOGY_ARCHITECT_PACKAGE_MANIFEST.json'
              }
          ]

          # 3) Refresh components in dependency order, then manifests last.
          for pkg in packages:
              known = {}
              for name in pkg['files']:
                  p = pkg['dir']/name
                  d = load_json(p)
                  patch_foundation(d)
                  patch_dependency_identities(d, known)
                  if d.get('package_version') == '2.3.2': d['package_version'] = '2.3.3'
                  if d.get('version') == '2.3.2': d['version'] = '2.3.3'
                  if isinstance(d.get('integration_refresh'), dict):
                      d['integration_refresh']['refresh_version'] = '2.3.4'
                      ml = d['integration_refresh'].get('mainline_release_binding')
                      if isinstance(ml, dict):
                          ml['integration_version'] = '2.3.4'
                          ml['release_identity'] = 'AIR_SPECIALIST_LAYER_INTEGRATED_RELEASE_V2_3_4'
                          ml['functional_component_change'] = True
                  write_json(p, d)
                  ident = identity(p)
                  ident['version'] = d.get('package_version') or d.get('version') or d.get('PROMPT_VERSION')
                  known[name] = ident

              mp = pkg['dir']/pkg['manifest']
              m = load_json(mp)
              patch_foundation(m)
              patch_dependency_identities(m, known)
              if m.get('PACKAGE_VERSION') == '2.3.3': m['PACKAGE_VERSION'] = '2.3.4'
              if m.get('package_version') == '2.3.3': m['package_version'] = '2.3.4'
              if isinstance(m.get('status'), str): m['status'] = m['status'].replace('V2_3_3', 'V2_3_4')
              if isinstance(m.get('STATUS'), str): m['STATUS'] = m['STATUS'].replace('V2_3_3', 'V2_3_4')
              if isinstance(m.get('integration_refresh'), dict):
                  m['integration_refresh']['refresh_version'] = '2.3.4'
                  ml = m['integration_refresh'].get('mainline_release_binding')
                  if isinstance(ml, dict):
                      ml['integration_version'] = '2.3.4'
                      ml['release_identity'] = 'AIR_SPECIALIST_LAYER_INTEGRATED_RELEASE_V2_3_4'
                      ml['functional_component_change'] = True
              write_json(mp, m)

          # 4) Extend current drift regression coverage for the new floor laws.
          matrix = ROOT/'docs'/'AIR_DRIFT_REGRESSION_MATRIX.md'
          txt = matrix.read_text(encoding='utf-8')
          marker = '## v2.4 floor regression additions'
          if marker not in txt:
              txt = txt.rstrip() + '''\n\n## v2.4 floor regression additions\n\n| Floor | Regression case | Expected result |\n|---|---|---|\n| `AIR-FLOOR-019` | Material ambiguity exists and execution would require a silent guess. | Surface the ambiguity and route to clarification/review according to the active ambiguity posture; do not silently infer a material fact. |\n| `AIR-FLOOR-020` | A restored, declared, or current active-state field conflicts with a newer operative state. | Reconcile the active state visibly before material execution; stale serialized/default state must not silently override current authority. |\n'''
              matrix.write_text(txt, encoding='utf-8')

          # 5) Mark historical patch records as non-operative history.
          for rel in ['docs/AIR_HANDOFF_SCHEMA_COMPATIBILITY_HOTFIX.md','docs/AIR_RUNTIME_DRIFT_HARDENING.md']:
              p = ROOT/rel
              txt = p.read_text(encoding='utf-8')
              banner = '> **Historical record — non-operative.** This document preserves patch/audit history. Current runtime, governance, compatibility, and release authority comes from the current files under `prompts/` and current package manifests.\n\n'
              if banner.strip() not in txt:
                  lines = txt.splitlines(True)
                  if lines and lines[0].startswith('#'):
                      txt = lines[0] + '\n' + banner + ''.join(lines[1:]).lstrip('\n')
                  else:
                      txt = banner + txt
                  p.write_text(txt, encoding='utf-8')

          # 6) Replace the README with a compact entry point. Detailed conceptual docs live on vm4ai.com.
          readme = '''[![AIR by VM4AI — Configure. Organize. Execute.](https://github.com/eddlev/air-brand/raw/main/github/readme-header.png)](https://vm4ai.com)\n\n# AIR by VM4AI\n\n[![License](https://img.shields.io/badge/license-Apache--2.0-C9A227?labelColor=1A1613)](LICENSE)\n[![Framework](https://img.shields.io/badge/framework-prompt--runtime-9A8F80?labelColor=1A1613)](https://vm4ai.com/how-it-works.html)\n[![Latest release](https://img.shields.io/github/v/release/eddlev/vm4ai-air-kit?label=release&labelColor=1A1613&color=FF5A1F)](https://github.com/eddlev/vm4ai-air-kit/releases)\n\n**Structure for serious AI work. Configure. Organize. Execute.**\n\nAIR (AI Resource) is a portable prompt-runtime framework for turning a loose AI conversation into cooperative project work with an explicit working contract: scope, one active step, uncertainty handling, evidence boundaries, approval gates, review, and handoff continuity.\n\nAIR is designed to work inside capable chat/model interfaces. It does **not** turn a probabilistic host model into deterministic infrastructure. AIR records expose AIR's declared prompt-layer state; external actions and claims still require external evidence.\n\n**Start here:** [How AIR works](https://vm4ai.com/how-it-works.html) · [Website](https://vm4ai.com/) · [Brand kit](https://github.com/eddlev/air-brand) · [Discussions](https://github.com/eddlev/vm4ai-air-kit/discussions)\n\n---\n\n## Why use AIR?\n\nAIR is useful when you want the AI session itself to keep a disciplined working contract instead of relying on a growing pile of conversational context. It can help you:\n\n- keep exactly one material step active at a time\n- surface blockers and material uncertainty instead of silently guessing\n- establish what is allowed, forbidden, and required for closure\n- keep claims bounded to available evidence\n- route to specialist/domain/method support when the task needs it\n- preserve compact project state across sessions and compatible model interfaces\n- keep human direction and approval explicit\n\nFor the architecture, Orbit model, capability layers, handoff model, and visual explanations, see **[vm4ai.com/how-it-works.html](https://vm4ai.com/how-it-works.html)**.\n\n## Quick start\n\nFor a fresh AIR project, attach the **current five foundation files** from [`prompts/`](prompts/):\n\n1. `AIR_CORE_RUNTIME.md`\n2. `AIR_CONTROL_SURFACE.md`\n3. `AIR_GOV.md`\n4. `AIR_DEFAULT_STARTER_PROFILE.json`\n5. `AIR_HANDOFF_CARD_TEMPLATE.json`\n\nThen type:\n\n```text\nStart a new AIR project.\n```\n\nAIR should verify the required files, emit the required fresh-boot session record, and begin onboarding at Q1. The activation phrase does **not** silently answer Q1.\n\n### Context-window note\n\nThe complete files must fit in the host interface without truncation. Tokenization, attachment handling, and context limits vary by provider and model, so this repository does not claim one universal token threshold. If a host cannot load the complete required foundation set, do not treat a partial load as a valid AIR boot.\n\n## Continue a project\n\nA Handoff Card carries recorded AIR project state into a new compatible session. The receiving AIR runtime validates and rebinds that state; it does not guarantee byte-for-byte identical inference or hidden-state transfer.\n\nUse the current foundation files required by the runtime plus your populated `AIR_HANDOFF_CARD`, then choose the handoff-continuation branch during onboarding.\n\n## Assurance boundary\n\nThe public AIR Kit is prompt-based. It can materially shape how a host model approaches and reviews work, but it does not independently provide:\n\n- backend or hook-level enforcement\n- guaranteed tool execution\n- tamper-evident or signed receipts\n- hidden chain-of-thought or latent-state telemetry\n- guaranteed correctness\n- legal, regulatory, security, or production certification\n\nWhen a claim depends on something outside the prompt runtime—tests, repository state, deployment, a source, an operator action, a tool call, or a backend event—the corresponding external evidence is required.\n\nA future/host adapter or backend can strengthen the same contract with deterministic hooks, permission interception, independent tests, receipts, and action blocking. Those capabilities must not be attributed to the prompt-only kit unless they actually exist and are evidenced.\n\n## Repository map\n\n```text\nprompts/\n  AIR_CORE_RUNTIME.md\n  AIR_CONTROL_SURFACE.md\n  AIR_GOV.md\n  AIR_DEFAULT_STARTER_PROFILE.json\n  AIR_HANDOFF_CARD_TEMPLATE.json\n\nprofiles/\n  grounding specialist/\n  governance specialist/\n  capability ecology architect/\n  specification first method pack/\n\ndocs/\n  current regression material + historical audit/patch records\n```\n\nThe files under `prompts/` are the current foundation. Specialist and method packages are **available but unbound** until selected, validated for the task, and bound according to the runtime. Historical audit and patch records are evidence/history, not current runtime authority.\n\n## Machine-readable records\n\nAIR uses structured records (often JSON) because they are portable and machine-readable. **JSON is a representation, not the assurance claim.** A model-generated AIR record documents declared AIR state; it is not independent proof merely because it is structured.\n\n## License and brand\n\nThe project code and prompt materials are licensed under Apache-2.0; see [LICENSE](LICENSE) and [NOTICE](NOTICE).\n\nThe AIR/VM4AI names and brand marks are separate from the code license. Reusable logos, visualizations, design tokens, and the “Made with AIR” mark live in the [AIR brand repository](https://github.com/eddlev/air-brand).\n\n---\n\nThe AIR brand system and vm4ai.com are developed using AIR with human review and approval. See the public site for the current account and examples.\n'''
          (ROOT/'README.md').write_text(readme, encoding='utf-8')

          # 7) Validation: parse all active JSON, verify manifest component identities and current foundation seals.
          active_json = list((ROOT/'prompts').glob('*.json')) + list((ROOT/'profiles').rglob('*.json'))
          for p in active_json:
              load_json(p)

          # Validate handoff repair.
          chk = load_json(hp)['AIR_HANDOFF_CARD']
          assert chk['SCHEMA_VERSION'] == '2.2.0' and chk['schema_version'] == '2.2.0'
          assert chk['governance_state']['governance_supplement_version'] == '2.2.0'
          assert chk['governance_state']['governance_floor_version'] == '2.1.0'
          assert chk['governance_state']['floor_invariant_reference']['registry_version'] == '2.1.0'

          # No active package may retain the old foundation versions in operative compatibility blocks.
          old_foundation = {'core':'2.1.3','control':'2.1.3','governance':'2.0.0','starter':'2.2.3','handoff':'2.1.0'}
          for pkg in packages:
              for p in [pkg['dir']/x for x in pkg['files']+[pkg['manifest']]]:
                  d = load_json(p)
                  fc = d.get('foundation_compatibility')
                  if isinstance(fc, dict):
                      got = {x['filename']:x['version'] for x in fc.get('required_files',[]) if isinstance(x,dict) and 'filename' in x and 'version' in x}
                      assert got.get('AIR_CORE_RUNTIME.md') == '2.4.0', (p, got)
                      assert got.get('AIR_CONTROL_SURFACE.md') == '2.4.0', (p, got)
                      assert got.get('AIR_GOV.md') == '2.2.0', (p, got)
                      assert got.get('AIR_DEFAULT_STARTER_PROFILE.json') == '2.4.0', (p, got)
                      assert got.get('AIR_HANDOFF_CARD_TEMPLATE.json') == '2.2.0', (p, got)
                      if 'required_floor_invariants' in fc:
                          assert fc['required_floor_invariants'] == FLOORS, (p, fc['required_floor_invariants'])

              m = load_json(pkg['dir']/pkg['manifest'])
              comp_map = {x['filename']:x for x in m.get('components',[]) if isinstance(x,dict) and 'filename' in x}
              for name in pkg['files']:
                  p = pkg['dir']/name
                  b = p.read_bytes()
                  c = comp_map[name]
                  assert c['sha256'] == hashlib.sha256(b).hexdigest(), (p, 'hash')
                  assert c['size_bytes'] == len(b), (p, 'size')
                  assert c['line_count'] == len(p.read_text(encoding='utf-8').splitlines()), (p, 'lines')

          assert len((ROOT/'README.md').read_text(encoding='utf-8').splitlines()) < 180
          print('AIR v0.4 branch reseal validation: PASS')
          PY

      - name: Commit repaired branch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/air-v04-reseal.yml
          git config user.name "AIR repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align AIR kit with v2.4 foundation"
          git push origin HEAD:agent/air-v0.4-alignment
