name: Group 2 Handoff governance patch

on:
  push:
    branches:
      - agent/group2-handoff-governance-alignment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/group2-handoff-governance-alignment
          fetch-depth: 0
      - name: Apply and precheck focused patch
        run: python .github/group2_patch.py
